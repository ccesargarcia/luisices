name: Limpeza de Versões do Secret Manager (Redução de Custos)

on:
  workflow_dispatch:
    inputs:
      target_project:
        description: 'Projeto GCP para limpeza'
        required: true
        type: choice
        options:
          - luisices-dev
          - papelaria-dashboard
        default: luisices-dev
      mode:
        description: 'Modo de Execução'
        required: true
        type: choice
        options:
          - dry-run (Apenas simular e listar economia)
          - destroy (Destruir versões antigas e zerar custo)
        default: 'dry-run (Apenas simular e listar economia)'

permissions:
  contents: read

jobs:
  cleanup-secrets:
    name: Limpeza Secret Manager
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Configurar Credenciais e Executar Auditoria/Limpeza
        env:
          TARGET_PROJECT: ${{ github.event.inputs.target_project }}
          MODE: ${{ github.event.inputs.mode }}
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          FIREBASE_SERVICE_ACCOUNT_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD || secrets.PROD_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "$TARGET_PROJECT" = "luisices-dev" ]; then
            if [ -z "$FIREBASE_SERVICE_ACCOUNT_DEV" ]; then
              echo "❌ ERRO: Secret FIREBASE_SERVICE_ACCOUNT_DEV não configurado."
              exit 1
            fi
            echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$HOME/sa-key.json"
          else
            if [ -z "$FIREBASE_SERVICE_ACCOUNT_PROD" ]; then
              echo "❌ ERRO: Secret FIREBASE_SERVICE_ACCOUNT_PROD não configurado."
              exit 1
            fi
            echo "$FIREBASE_SERVICE_ACCOUNT_PROD" > "$HOME/sa-key.json"
          fi

          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa-key.json"

          if [[ "$MODE" == *"destroy"* ]]; then
            echo "🚀 Executando em modo DESTRUIÇÃO REAL no projeto $TARGET_PROJECT..."
            node scripts/cleanup-secret-versions.mjs --project="$TARGET_PROJECT" --destroy
          else
            echo "🔍 Executando em modo SIMULAÇÃO (DRY-RUN) no projeto $TARGET_PROJECT..."
            node scripts/cleanup-secret-versions.mjs --project="$TARGET_PROJECT" --dry-run
          fi

          rm -f "$HOME/sa-key.json"
