name: Production Release (main)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan production release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      functions: ${{ steps.changes.outputs.functions }}
      functions_scope: ${{ steps.changes.outputs.functions_scope }}
      indexes: ${{ steps.changes.outputs.indexes }}
      rules: ${{ steps.changes.outputs.rules }}
      cloudflare_api: ${{ steps.changes.outputs.cloudflare_api }}
      cloudflare_cdn: ${{ steps.changes.outputs.cloudflare_cdn }}
      cloudflare_cache: ${{ steps.changes.outputs.cloudflare_cache }}
      cloudflare_target: ${{ steps.changes.outputs.cloudflare_target }}
      frontend: ${{ steps.changes.outputs.frontend }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect production components
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="$BEFORE_SHA"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE=$(git rev-parse HEAD~1)
            else
              BASE=""
            fi
          fi

          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" "$HEAD_SHA")
          else
            echo '⚠️ Sem commit base anterior conhecido; release será conservadora e publicará todos os componentes.'
            CHANGED='*'
          fi

          matches() {
            local pattern="$1"
            printf '%s\n' "$CHANGED" | grep -Eq "$pattern"
          }

          frontend=false
          indexes=false
          rules=false
          cloudflare_api=false
          cloudflare_cdn=false
          cloudflare_cache=false
          functions=false
          functions_scope="all"

          if matches '(^\*?$|^(src/|public/|index\.html$|vite\.config\.|package(-lock)?\.json$|tsconfig[^/]*\.json$))'; then frontend=true; fi
          if matches '(^\*?$|^firestore\.indexes\.json$)'; then indexes=true; fi
          if matches '(^\*?$|^(firestore\.rules|storage\.rules|database\.rules\.json|firebase\.json)$)'; then rules=true; fi
          if matches '(^\*?$|^cloudflare/api-worker/|^scripts/(ensure-mcp-cache-bypass|ensure-order-tracking-rate-limit|purge-cloudflare-cache)\.mjs$)'; then cloudflare_api=true; fi
          if matches '(^\*?$|^cloudflare/cdn-worker/)'; then cloudflare_cdn=true; fi
          if matches '(^\*?$|^functions/(mcp|ai)/|^public/\.well-known/)'; then cloudflare_cache=true; fi
          if matches '(^\*?$|^functions/|^scripts/sync-secrets-safe\.mjs$)'; then
            functions=true
            if [ "$CHANGED" != '*' ] && [ -n "$BASE" ]; then
              CHANGED_FN=$(git diff --name-only "$BASE" "$HEAD_SHA" -- functions/)
              if [ -n "$CHANGED_FN" ] && ! echo "$CHANGED_FN" | grep -qvE '^functions/(email|whatsapp|alexa|users|mcp|orders|ai|media)/'; then
                functions_scope=$(node scripts/functions-deploy-map.mjs --resolve-scope --env=prod "$CHANGED_FN")
              fi
            fi
          fi

          cloudflare_target=''
          if [ "$cloudflare_api" = true ] && [ "$cloudflare_cdn" = true ]; then cloudflare_target='all'
          elif [ "$cloudflare_api" = true ]; then cloudflare_target='api'
          elif [ "$cloudflare_cdn" = true ]; then cloudflare_target='cdn'
          fi

          has_changes=false
          if [ "$frontend" = true ] || [ "$indexes" = true ] || [ "$rules" = true ] || [ "$cloudflare_target" != '' ] || [ "$cloudflare_cache" = true ] || [ "$functions" = true ]; then
            has_changes=true
          fi

          {
            echo "frontend=$frontend"
            echo "indexes=$indexes"
            echo "rules=$rules"
            echo "cloudflare_api=$cloudflare_api"
            echo "cloudflare_cdn=$cloudflare_cdn"
            echo "cloudflare_cache=$cloudflare_cache"
            echo "cloudflare_target=$cloudflare_target"
            echo "functions=$functions"
            echo "functions_scope=$functions_scope"
            echo "has_changes=$has_changes"
          } >> "$GITHUB_OUTPUT"

          printf 'Production release plan: frontend=%s indexes=%s rules=%s cloudflare=%s functions=%s (scope=%s)\n' \
            "$frontend" "$indexes" "$rules" "$cloudflare_target" "$functions" "$functions_scope"

  indexes:
    name: Firestore Indexes (Production)
    needs: plan
    if: needs.plan.outputs.indexes == 'true'
    uses: ./.github/workflows/deploy-indexes.yml
    with:
      environment: prod
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_SERVICE_ACCOUNT_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

  functions:
    name: Functions (Production)
    needs: [plan, indexes]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.indexes.result == 'success' || needs.indexes.result == 'skipped') &&
      needs.plan.outputs.functions == 'true'
    uses: ./.github/workflows/deploy-functions-manual.yml
    with:
      environment: prod
      functions_target: ${{ needs.plan.outputs.functions_scope }}
      deploy_rules_and_indexes: false
      update_secrets: false
    secrets:
      ALEXA_IDENTITY_HMAC_KEY: ${{ secrets.ALEXA_IDENTITY_HMAC_KEY }}
      ALEXA_PROD_SKILL_ID: ${{ secrets.ALEXA_PROD_SKILL_ID }}
      ALEXA_SKILL_ID: ${{ secrets.ALEXA_SKILL_ID }}
      EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_SERVICE_ACCOUNT_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
      PROD_ALEXA_IDENTITY_HMAC_KEY: ${{ secrets.PROD_ALEXA_IDENTITY_HMAC_KEY }}
      PROD_ALEXA_SKILL_ID: ${{ secrets.PROD_ALEXA_SKILL_ID }}
      PROD_EVOLUTION_API_KEY: ${{ secrets.PROD_EVOLUTION_API_KEY }}
      PROD_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT }}
      PROD_FUNCTIONS_SENTRY_DSN: ${{ secrets.PROD_FUNCTIONS_SENTRY_DSN }}
      PROD_GEMINI: ${{ secrets.PROD_GEMINI }}
      PROD_GEMINI_API_KEY: ${{ secrets.PROD_GEMINI_API_KEY }}
      PROD_ORDER_TRACKING_ENCRYPTION_KEY: ${{ secrets.PROD_ORDER_TRACKING_ENCRYPTION_KEY }}
      PROD_ORIGIN_SECRET: ${{ secrets.PROD_ORIGIN_SECRET }}
      PROD_RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
      PROD_RESEND_WEBHOOK_SECRET: ${{ secrets.PROD_RESEND_WEBHOOK_SECRET }}
      PROD_SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN }}
      PROD_VITE_SENTRY_DSN: ${{ secrets.PROD_VITE_SENTRY_DSN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

  cloudflare:
    name: Cloudflare Workers (Production)
    needs: [plan, indexes, functions]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.indexes.result == 'success' || needs.indexes.result == 'skipped') &&
      (needs.functions.result == 'success' || needs.functions.result == 'skipped') &&
      needs.plan.outputs.cloudflare_target != ''
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      target_environment: production
      target_worker: ${{ needs.plan.outputs.cloudflare_target }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
      PROD_CLOUDFLARE_SENTRY_DSN: ${{ secrets.PROD_CLOUDFLARE_SENTRY_DSN }}
      PROD_FUNCTIONS_SENTRY_DSN: ${{ secrets.PROD_FUNCTIONS_SENTRY_DSN }}
      PROD_ORIGIN_SECRET: ${{ secrets.PROD_ORIGIN_SECRET }}
      PROD_SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN }}
      PROD_VITE_SENTRY_DSN: ${{ secrets.PROD_VITE_SENTRY_DSN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

  purge-mcp-cache:
    name: Purge MCP metadata cache (Production)
    needs: [plan, functions, cloudflare]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.functions.result == 'success' || needs.functions.result == 'skipped') &&
      (needs.cloudflare.result == 'success' || needs.cloudflare.result == 'skipped') &&
      needs.plan.outputs.cloudflare_cache == 'true' &&
      needs.plan.outputs.cloudflare_api != 'true'
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      target_environment: production
      target_worker: cache
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  frontend:
    name: Frontend (Production)
    needs: [plan, indexes, functions, cloudflare]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.indexes.result == 'success' || needs.indexes.result == 'skipped') &&
      (needs.functions.result == 'success' || needs.functions.result == 'skipped') &&
      (needs.cloudflare.result == 'success' || needs.cloudflare.result == 'skipped') &&
      needs.plan.outputs.frontend == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      PROD_VITE_FIREBASE_API_KEY: ${{ secrets.PROD_VITE_FIREBASE_API_KEY }}
      PROD_VITE_FIREBASE_APP_ID: ${{ secrets.PROD_VITE_FIREBASE_APP_ID }}
      PROD_VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_VITE_FIREBASE_AUTH_DOMAIN }}
      PROD_VITE_FIREBASE_DATABASE_URL: ${{ secrets.PROD_VITE_FIREBASE_DATABASE_URL }}
      PROD_VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.PROD_VITE_FIREBASE_MEASUREMENT_ID }}
      PROD_VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_VITE_FIREBASE_MESSAGING_SENDER_ID }}
      PROD_VITE_FIREBASE_PROJECT_ID: ${{ secrets.PROD_VITE_FIREBASE_PROJECT_ID }}
      PROD_VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_VITE_FIREBASE_STORAGE_BUCKET }}
      PROD_VITE_FUNCTIONS_CUSTOM_DOMAIN: ${{ secrets.PROD_VITE_FUNCTIONS_CUSTOM_DOMAIN }}
      PROD_VITE_SENTRY_DSN: ${{ secrets.PROD_VITE_SENTRY_DSN }}
      PROD_VITE_STORAGE_CDN_URL: ${{ secrets.PROD_VITE_STORAGE_CDN_URL }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FUNCTIONS_CUSTOM_DOMAIN: ${{ secrets.VITE_FUNCTIONS_CUSTOM_DOMAIN }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_STORAGE_CDN_URL: ${{ secrets.VITE_STORAGE_CDN_URL }}

  rules:
    name: Firebase Rules (Production, last)
    needs: [plan, indexes, functions, cloudflare, purge-mcp-cache, frontend]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.indexes.result == 'success' || needs.indexes.result == 'skipped') &&
      (needs.functions.result == 'success' || needs.functions.result == 'skipped') &&
      (needs.cloudflare.result == 'success' || needs.cloudflare.result == 'skipped') &&
      (needs.purge-mcp-cache.result == 'success' || needs.purge-mcp-cache.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      needs.plan.outputs.rules == 'true'
    uses: ./.github/workflows/deploy-firebase-rules-production.yml
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_SERVICE_ACCOUNT_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
      PROD_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT }}

  release-summary:
    name: Release result
    needs: [plan, indexes, functions, cloudflare, purge-mcp-cache, frontend, rules]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report release status
        env:
          PLAN: ${{ needs.plan.result }}
          INDEXES: ${{ needs.indexes.result }}
          FUNCTIONS: ${{ needs.functions.result }}
          CLOUDFLARE: ${{ needs.cloudflare.result }}
          CACHE_PURGE: ${{ needs.purge-mcp-cache.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RULES: ${{ needs.rules.result }}
        run: |
          printf 'Plan: %s\nIndexes: %s\nFunctions: %s\nCloudflare: %s\nCache purge: %s\nFrontend: %s\nRules: %s\n' \
            "$PLAN" "$INDEXES" "$FUNCTIONS" "$CLOUDFLARE" "$CACHE_PURGE" "$FRONTEND" "$RULES"
          for result in "$PLAN" "$INDEXES" "$FUNCTIONS" "$CLOUDFLARE" "$CACHE_PURGE" "$FRONTEND" "$RULES"; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then exit 1; fi
          done
