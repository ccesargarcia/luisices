name: Production Release (main)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan production release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      functions: ${{ steps.changes.outputs.functions }}
      functions_scope: ${{ steps.changes.outputs.functions_scope }}
      indexes: ${{ steps.changes.outputs.indexes }}
      rules: ${{ steps.changes.outputs.rules }}
      cloudflare_api: ${{ steps.changes.outputs.cloudflare_api }}
      cloudflare_cdn: ${{ steps.changes.outputs.cloudflare_cdn }}
      cloudflare_cache: ${{ steps.changes.outputs.cloudflare_cache }}
      cloudflare_target: ${{ steps.changes.outputs.cloudflare_target }}
      frontend: ${{ steps.changes.outputs.frontend }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect production components
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="$BEFORE_SHA"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE=$(git rev-parse HEAD~1)
            else
              BASE=""
            fi
          fi

          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" "$HEAD_SHA")
          else
            echo '⚠️ Sem commit base anterior conhecido; release será conservadora e publicará todos os componentes.'
            CHANGED='*'
          fi

          matches() {
            local pattern="$1"
            printf '%s\n' "$CHANGED" | grep -Eq "$pattern"
          }

          frontend=false
          indexes=false
          rules=false
          cloudflare_api=false
          cloudflare_cdn=false
          cloudflare_cache=false
          functions=false
          functions_scope="all"

          if matches '(^\*?$|^(src/|public/|index\.html$|vite\.config\.|package(-lock)?\.json$|tsconfig[^/]*\.json$))'; then frontend=true; fi
          if matches '(^\*?$|^firestore\.indexes\.json$)'; then indexes=true; fi
          if matches '(^\*?$|^(firestore\.rules|storage\.rules|database\.rules\.json|firebase\.json)$)'; then rules=true; fi
          if matches '(^\*?$|^cloudflare/api-worker/|^scripts/(ensure-mcp-cache-bypass|ensure-order-tracking-rate-limit|purge-cloudflare-cache)\.mjs$)'; then cloudflare_api=true; fi
          if matches '(^\*?$|^cloudflare/cdn-worker/)'; then cloudflare_cdn=true; fi
          if matches '(^\*?$|^functions/(mcp|ai)/|^public/\.well-known/)'; then cloudflare_cache=true; fi
          if matches '(^\*?$|^functions/|^scripts/sync-secrets-safe\.mjs$)'; then
            functions=true
            if [ "$CHANGED" != '*' ] && [ -n "$BASE" ]; then
              CHANGED_FN=$(git diff --name-only "$BASE" "$HEAD_SHA" -- functions/)
              if ! echo "$CHANGED_FN" | grep -qvE '^functions/(email|whatsapp|alexa|users|mcp|orders|ai)/'; then
                MODULES=$(echo "$CHANGED_FN" | sed -E 's|^functions/([^/]+)/.*|\1|' | sort -u)
                if [ $(echo "$MODULES" | wc -l) -eq 1 ]; then
                  functions_scope="$MODULES"
                fi
              fi
            fi
          fi

          cloudflare_target=''
          if [ "$cloudflare_api" = true ] && [ "$cloudflare_cdn" = true ]; then cloudflare_target='all'
          elif [ "$cloudflare_api" = true ]; then cloudflare_target='api'
          elif [ "$cloudflare_cdn" = true ]; then cloudflare_target='cdn'
          fi

          has_changes=false
          if [ "$frontend" = true ] || [ "$indexes" = true ] || [ "$rules" = true ] || [ "$cloudflare_target" != '' ] || [ "$cloudflare_cache" = true ] || [ "$functions" = true ]; then
            has_changes=true
          fi

          {
            echo "frontend=$frontend"
            echo "indexes=$indexes"
            echo "rules=$rules"
            echo "cloudflare_api=$cloudflare_api"
            echo "cloudflare_cdn=$cloudflare_cdn"
            echo "cloudflare_cache=$cloudflare_cache"
            echo "cloudflare_target=$cloudflare_target"
            echo "functions=$functions"
            echo "functions_scope=$functions_scope"
            echo "has_changes=$has_changes"
          } >> "$GITHUB_OUTPUT"

          printf 'Production release plan: frontend=%s indexes=%s rules=%s cloudflare=%s functions=%s (scope=%s)\n' \
            "$frontend" "$indexes" "$rules" "$cloudflare_target" "$functions" "$functions_scope"

  indexes:
    name: Firestore Indexes (Production)
    needs: plan
    if: needs.plan.outputs.indexes == 'true'
    uses: ./.github/workflows/deploy-indexes.yml
    with:
      environment: prod
    secrets: inherit

  functions:
    name: Functions (Production)
    needs: [plan, indexes]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.indexes.result == 'success' || needs.indexes.result == 'skipped') &&
      needs.plan.outputs.functions == 'true'
    uses: ./.github/workflows/deploy-functions-manual.yml
    with:
      environment: prod
      functions_target: ${{ needs.plan.outputs.functions_scope }}
      deploy_rules_and_indexes: false
      update_secrets: false
    secrets: inherit

  cloudflare:
    name: Cloudflare Workers (Production)
    needs: [plan, indexes, functions]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.indexes.result == 'success' || needs.indexes.result == 'skipped') &&
      (needs.functions.result == 'success' || needs.functions.result == 'skipped') &&
      needs.plan.outputs.cloudflare_target != ''
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      target_environment: production
      target_worker: ${{ needs.plan.outputs.cloudflare_target }}
    secrets: inherit

  purge-mcp-cache:
    name: Purge MCP metadata cache (Production)
    needs: [plan, functions, cloudflare]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.functions.result == 'success' || needs.functions.result == 'skipped') &&
      (needs.cloudflare.result == 'success' || needs.cloudflare.result == 'skipped') &&
      needs.plan.outputs.cloudflare_cache == 'true' &&
      needs.plan.outputs.cloudflare_api != 'true'
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      target_environment: production
      target_worker: cache
    secrets: inherit

  frontend:
    name: Frontend (Production)
    needs: [plan, indexes, functions, cloudflare, purge-mcp-cache]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.indexes.result == 'success' || needs.indexes.result == 'skipped') &&
      (needs.functions.result == 'success' || needs.functions.result == 'skipped') &&
      (needs.cloudflare.result == 'success' || needs.cloudflare.result == 'skipped') &&
      (needs.purge-mcp-cache.result == 'success' || needs.purge-mcp-cache.result == 'skipped') &&
      needs.plan.outputs.frontend == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  rules:
    name: Firebase Rules (Production, last)
    needs: [plan, indexes, functions, cloudflare, purge-mcp-cache, frontend]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.indexes.result == 'success' || needs.indexes.result == 'skipped') &&
      (needs.functions.result == 'success' || needs.functions.result == 'skipped') &&
      (needs.cloudflare.result == 'success' || needs.cloudflare.result == 'skipped') &&
      (needs.purge-mcp-cache.result == 'success' || needs.purge-mcp-cache.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      needs.plan.outputs.rules == 'true'
    uses: ./.github/workflows/deploy-firebase-rules-production.yml
    secrets: inherit

  release-summary:
    name: Release result
    needs: [plan, indexes, functions, cloudflare, purge-mcp-cache, frontend, rules]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report release status
        env:
          PLAN: ${{ needs.plan.result }}
          INDEXES: ${{ needs.indexes.result }}
          FUNCTIONS: ${{ needs.functions.result }}
          CLOUDFLARE: ${{ needs.cloudflare.result }}
          CACHE_PURGE: ${{ needs.purge-mcp-cache.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RULES: ${{ needs.rules.result }}
        run: |
          printf 'Plan: %s\nIndexes: %s\nFunctions: %s\nCloudflare: %s\nCache purge: %s\nFrontend: %s\nRules: %s\n' \
            "$PLAN" "$INDEXES" "$FUNCTIONS" "$CLOUDFLARE" "$CACHE_PURGE" "$FRONTEND" "$RULES"
          for result in "$PLAN" "$INDEXES" "$FUNCTIONS" "$CLOUDFLARE" "$CACHE_PURGE" "$FRONTEND" "$RULES"; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then exit 1; fi
          done
