name: Deploy Firebase Functions (Dev manual / Production reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Ambiente selecionado pelo orquestrador de release'
        required: true
        type: string
      functions_target:
        description: 'auto ou lista explícita de Functions'
        required: false
        default: 'auto'
        type: string
      functions_base_sha:
        description: 'Último SHA de produção com Functions publicado com sucesso'
        required: false
        default: ''
        type: string
      deploy_rules_and_indexes:
        required: false
        default: false
        type: boolean
      update_secrets:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de destino'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      functions_target:
        description: 'Selecione o grupo ou função para deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'alexaWebhook,approveAlexaPairing,setAlexaPermission,revokeAlexaBinding,toggleGlobalAlexaIntegration,getAlexaIntegrationStatus,approveAlexaDraft,cancelAlexaDraft'
          - 'sendWhatsAppDirectMessage,deleteWhatsAppMessage,syncWhatsAppChatMessages,getWhatsAppInstanceStatus,evolutionWhatsAppWebhook,markWhatsAppChatRead,ensureWhatsAppConversation'
          - 'aiAgentChat,enrichGalleryItemWithAi,enrichStoreProductWithAi,getAiUsage,createOrder,updateComplexOrder,submitPublicCatalogOrder,getPublicCatalogProducts,calculateSuperfreteShipping,createSuperfreteLabel,galleryMedia'
          - 'createOrderTrackingLink,listOrderTrackingLinks,revokeOrderTrackingLink,revokeOrderTrackingLinkById,deleteOrderTrackingLink,deleteOrderTrackingLinksBatch,getPublicOrderTracking'
          - 'cleanupEmailDrafts,resendReceivingWebhook,sendCustomEmail,getEmailUsage'
          - 'updateUser,recordUserPasswordChange,completeUserInvitation,createUserInvitation,createUser,getUserAccountMetadata,deleteUser,revokeAllSessions,repairUserClaims,registerDeviceSession,revokeDeviceSession,sendAdminPasswordReset,sendPasswordResetEmail,sendVerificationEmail,validateUserInvitation'
          - 'getMcpSettingsStatus,createMcpApiKey,toggleMcpApiKey,revokeMcpApiKey,toggleGlobalMcp,setUserMcpEligibility,chatGptToolsEndpoint'
          - 'alexaWebhook'
          - 'aiAgentChat'
          - 'chatGptToolsEndpoint'
          - 'sendWhatsAppDirectMessage'
          - 'evolutionWhatsAppWebhook'
          - 'cleanupEmailDrafts'
          - 'createOrder'
          - 'updateComplexOrder'
          - 'submitPublicCatalogOrder'
          - 'getPublicCatalogProducts'
          - 'calculateSuperfreteShipping'
          - 'createSuperfreteLabel'
          - 'galleryMedia'
      deploy_rules_and_indexes:
        description: 'Publicar Firestore Rules e Indexes? (Já publicado no deploy de Hosting)'
        required: false
        default: false
        type: boolean
      update_secrets:
        description: 'Atualizar secrets no Secret Manager? (Sincroniza tokens e chaves do GitHub Secrets no GCP)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: "firebase-functions-deploy-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.32.1

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Determine Target Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.environment }}"
          else
            TARGET="${{ inputs.environment }}"
          fi
          case "$TARGET" in
            dev|prod) ;;
            *) echo "Ambiente de deploy inválido: $TARGET"; exit 1 ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Deploy Firebase Functions & Rules (Dev)
        if: steps.env.outputs.target == 'dev'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          SENTRY_DSN: ${{ secrets.DEV_FUNCTIONS_SENTRY_DSN || secrets.DEV_SENTRY_DSN || secrets.DEV_VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          RESEND_API_KEY: ${{ secrets.DEV_RESEND_API_KEY || secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.DEV_RESEND_WEBHOOK_SECRET || secrets.RESEND_WEBHOOK_SECRET }}
          EVOLUTION_API_KEY: ${{ secrets.DEV_EVOLUTION_API_KEY || secrets.EVOLUTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.DEV_GEMINI || secrets.dev_gemini || secrets.DEV_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          ORIGIN_SECRET: ${{ secrets.DEV_ORIGIN_SECRET || secrets.ORIGIN_SECRET }}
          SUPERFRETE_SANDBOX_TOKEN: ${{ secrets.SUPERFRETE_SANDBOX_TOKEN }}
          ORDER_TRACKING_ENCRYPTION_KEY: ${{ secrets.DEV_ORDER_TRACKING_ENCRYPTION_KEY }}
          GCLOUD_PROJECT: luisices-dev
        run: |
          trap 'rm -f functions/.env.luisices-dev "$HOME/order_tracking_encryption_key.txt" "$HOME/origin_secret.txt"' EXIT
          if [ -n "$SENTRY_DSN" ]; then
            printf 'SENTRY_DSN=%s\nSENTRY_ENVIRONMENT=development\n' "$SENTRY_DSN" > functions/.env.luisices-dev
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"
          firebase use luisices-dev --project luisices-dev --non-interactive

          if [ -z "$ORIGIN_SECRET" ]; then
            echo "❌ DEV_ORIGIN_SECRET / ORIGIN_SECRET é obrigatório para proteger as funções callable."
            exit 1
          fi

          deploy_chunk() {
            local label="$1"
            local targets="$2"
            echo "📦 Deploying $label: $targets"
            if ! firebase deploy --only "$targets" --project luisices-dev --non-interactive --force; then
              echo "⚠️ Falha temporária em $label. Aguardando 25s para esvaziar fila de workers e tentando novamente..."
              sleep 25
              firebase deploy --only "$targets" --project luisices-dev --non-interactive --force
            fi
          }

          # Atualiza segredos no Secret Manager apenas se explicitamente solicitado
          if [ "${{ inputs.update_secrets }}" = "true" ]; then
            echo "🔐 Atualizando secrets no Google Secret Manager (Dev)..."
            echo "$RESEND_API_KEY" > "$HOME/resend_api_key.txt"
            echo "$EVOLUTION_API_KEY" > "$HOME/evolution_api_key.txt"
            echo "$GEMINI_API_KEY" > "$HOME/gemini_api_key.txt"
            firebase functions:secrets:set RESEND_API_KEY --project luisices-dev --data-file "$HOME/resend_api_key.txt" --non-interactive --force || true
            firebase functions:secrets:set EVOLUTION_API_KEY --project luisices-dev --data-file "$HOME/evolution_api_key.txt" --non-interactive --force || true
            if [ -n "$RESEND_WEBHOOK_SECRET" ]; then
              echo "$RESEND_WEBHOOK_SECRET" > "$HOME/resend_webhook.txt"
              firebase functions:secrets:set RESEND_WEBHOOK_SECRET --project luisices-dev --data-file "$HOME/resend_webhook.txt" --non-interactive --force || true
            fi
            if [ -n "$GEMINI_API_KEY" ]; then
              firebase functions:secrets:set GEMINI_API_KEY --project luisices-dev --data-file "$HOME/gemini_api_key.txt" --non-interactive --force || true
            fi
            if [ -z "$SUPERFRETE_SANDBOX_TOKEN" ]; then
              echo "❌ SUPERFRETE_SANDBOX_TOKEN não configurada nos GitHub Actions Secrets."
              exit 1
            fi
            printf '%s' "$SUPERFRETE_SANDBOX_TOKEN" > "$HOME/superfrete_sandbox_token.txt"
            firebase functions:secrets:set SUPERFRETE_SANDBOX_TOKEN --project luisices-dev --data-file "$HOME/superfrete_sandbox_token.txt" --non-interactive --force
            if [ -n "$ORDER_TRACKING_ENCRYPTION_KEY" ]; then
              printf '%s' "$ORDER_TRACKING_ENCRYPTION_KEY" > "$HOME/order_tracking_encryption_key.txt"
              firebase functions:secrets:set ORDER_TRACKING_ENCRYPTION_KEY --project luisices-dev --data-file "$HOME/order_tracking_encryption_key.txt" --non-interactive --force
            fi
            if [ -n "${{ secrets.DEV_ALEXA_IDENTITY_HMAC_KEY || secrets.ALEXA_IDENTITY_HMAC_KEY_DEV || secrets.ALEXA_IDENTITY_HMAC_KEY }}" ]; then
              echo "${{ secrets.DEV_ALEXA_IDENTITY_HMAC_KEY || secrets.ALEXA_IDENTITY_HMAC_KEY_DEV || secrets.ALEXA_IDENTITY_HMAC_KEY }}" > "$HOME/alexa_hmac.txt"
              firebase functions:secrets:set ALEXA_IDENTITY_HMAC_KEY --project luisices-dev --data-file "$HOME/alexa_hmac.txt" --non-interactive --force || true
            fi
            printf '%s' "$ORIGIN_SECRET" > "$HOME/origin_secret.txt"
            firebase functions:secrets:set ORIGIN_SECRET --project luisices-dev --data-file "$HOME/origin_secret.txt" --non-interactive --force
          fi

          if ! firebase functions:secrets:get ORDER_TRACKING_ENCRYPTION_KEY --project luisices-dev --non-interactive > /dev/null 2>&1; then
            if [ -z "$ORDER_TRACKING_ENCRYPTION_KEY" ]; then
              echo "❌ Configure DEV_ORDER_TRACKING_ENCRYPTION_KEY no GitHub ou no Secret Manager do projeto luisices-dev antes do deploy."
              exit 1
            fi
            printf '%s' "$ORDER_TRACKING_ENCRYPTION_KEY" > "$HOME/order_tracking_encryption_key.txt"
            firebase functions:secrets:set ORDER_TRACKING_ENCRYPTION_KEY --project luisices-dev --data-file "$HOME/order_tracking_encryption_key.txt" --non-interactive --force
          fi

          if [ -n "${{ secrets.DEV_ALEXA_IDENTITY_HMAC_KEY || secrets.ALEXA_IDENTITY_HMAC_KEY_DEV || secrets.ALEXA_IDENTITY_HMAC_KEY }}" ] && ! firebase functions:secrets:get ALEXA_IDENTITY_HMAC_KEY --project luisices-dev --non-interactive > /dev/null 2>&1; then
            echo "🔐 Inicializando ALEXA_IDENTITY_HMAC_KEY no Secret Manager (Dev)..."
            echo "${{ secrets.DEV_ALEXA_IDENTITY_HMAC_KEY || secrets.ALEXA_IDENTITY_HMAC_KEY_DEV || secrets.ALEXA_IDENTITY_HMAC_KEY }}" > "$HOME/alexa_hmac.txt"
            firebase functions:secrets:set ALEXA_IDENTITY_HMAC_KEY --project luisices-dev --data-file "$HOME/alexa_hmac.txt" --non-interactive --force || true
          fi

          if ! firebase functions:secrets:get ORIGIN_SECRET --project luisices-dev --non-interactive > /dev/null 2>&1; then
            echo "🔐 Inicializando ORIGIN_SECRET no Secret Manager (Dev)..."
            printf '%s' "$ORIGIN_SECRET" > "$HOME/origin_secret.txt"
            firebase functions:secrets:set ORIGIN_SECRET --project luisices-dev --data-file "$HOME/origin_secret.txt" --non-interactive --force
          fi

          if [ "${{ inputs.deploy_rules_and_indexes }}" = "true" ]; then
            echo "📄 Publicando regras e índices do Firestore..."
            firebase deploy --only firestore:rules,firestore:indexes,database --project luisices-dev --non-interactive --force
          fi

          INPUT_FN="${{ inputs.functions_target }}"
          if [ "$INPUT_FN" = "superfrete" ]; then
            echo "🚚 Deploy seletivo das Functions da SuperFrete..."
            deploy_chunk "SuperFrete" "functions:calculateSuperfreteShipping,functions:createSuperfreteLabel"
          elif [ "$INPUT_FN" = "email" ]; then
            echo "📧 Deploy seletivo das Functions de E-mail..."
            deploy_chunk "E-mail" "functions:cleanupEmailDrafts,functions:resendReceivingWebhook,functions:sendCustomEmail,functions:getEmailUsage"
          elif [ "$INPUT_FN" = "whatsapp" ]; then
            echo "💬 Deploy seletivo das Functions do WhatsApp..."
            deploy_chunk "WhatsApp" "functions:sendWhatsAppDirectMessage,functions:deleteWhatsAppMessage,functions:syncWhatsAppChatMessages,functions:getWhatsAppInstanceStatus,functions:evolutionWhatsAppWebhook,functions:markWhatsAppChatRead,functions:ensureWhatsAppConversation"
          elif [ "$INPUT_FN" = "alexa" ]; then
            echo "🗣️ Deploy seletivo das Functions da Alexa..."
            deploy_chunk "Alexa" "functions:approveAlexaDraft,functions:approveAlexaPairing,functions:cancelAlexaDraft,functions:getAlexaIntegrationStatus,functions:revokeAlexaBinding,functions:setAlexaPermission,functions:toggleGlobalAlexaIntegration,functions:alexaWebhook"
          elif [ "$INPUT_FN" = "users" ]; then
            echo "👥 Deploy seletivo das Functions de Usuários..."
            deploy_chunk "Usuários" "functions:updateUser,functions:recordUserPasswordChange,functions:completeUserInvitation,functions:createUserInvitation,functions:createUser,functions:getUserAccountMetadata,functions:deleteUser,functions:revokeAllSessions,functions:repairUserClaims,functions:registerDeviceSession,functions:revokeDeviceSession,functions:sendAdminPasswordReset,functions:sendPasswordResetEmail,functions:sendVerificationEmail,functions:validateUserInvitation"
          elif [ "$INPUT_FN" = "orders" ]; then
            echo "📦 Deploy seletivo das Functions de Pedidos e Acompanhamento..."
            deploy_chunk "Pedidos" "functions:createOrder,functions:updateComplexOrder,functions:submitPublicCatalogOrder,functions:getPublicCatalogProducts,functions:calculateSuperfreteShipping,functions:createSuperfreteLabel,functions:galleryMedia"
            deploy_chunk "Acompanhamento" "functions:createOrderTrackingLink,functions:listOrderTrackingLinks,functions:revokeOrderTrackingLink,functions:revokeOrderTrackingLinkById,functions:deleteOrderTrackingLink,functions:deleteOrderTrackingLinksBatch,functions:getPublicOrderTracking"
          elif [ "$INPUT_FN" = "mcp" ]; then
            echo "🤖 Deploy seletivo das Functions do MCP..."
            deploy_chunk "MCP" "functions:getMcpSettingsStatus,functions:createMcpApiKey,functions:updateMcpApiKeyScopes,functions:toggleMcpApiKey,functions:revokeMcpApiKey,functions:toggleGlobalMcp,functions:setUserMcpEligibility,functions:revokeMcpSession,functions:getMcpAuditLogs,functions:getMcpOpenApiSchema,functions:chatGptToolsEndpoint"
          elif [ "$INPUT_FN" = "ai" ]; then
            echo "🧠 Deploy seletivo das Functions de IA e seus consumidores MCP (chatGptToolsEndpoint e callables)..."
            deploy_chunk "IA" "functions:aiAgentChat,functions:getAiUsage,functions:enrichGalleryItemWithAi,functions:enrichStoreProductWithAi"
            deploy_chunk "MCP" "functions:getMcpSettingsStatus,functions:createMcpApiKey,functions:updateMcpApiKeyScopes,functions:toggleMcpApiKey,functions:revokeMcpApiKey,functions:toggleGlobalMcp,functions:setUserMcpEligibility,functions:revokeMcpSession,functions:getMcpAuditLogs,functions:getMcpOpenApiSchema,functions:chatGptToolsEndpoint"
          elif [ -n "$INPUT_FN" ] && [ "$INPUT_FN" != "all" ] && [ "$INPUT_FN" != "auto" ]; then
            TARGETS=$(echo "$INPUT_FN" | tr ',' ' ' | tr -s ' ')
            DEPLOY_TARGET=""
            for fn in $TARGETS; do
              fn_clean=$(echo "$fn" | sed 's/^functions://')
              if [ -n "$fn_clean" ]; then
                if [ -z "$DEPLOY_TARGET" ]; then
                  DEPLOY_TARGET="functions:$fn_clean"
                else
                  DEPLOY_TARGET="$DEPLOY_TARGET,functions:$fn_clean"
                fi
              fi
            done
            echo "🚀 Realizando deploy direcionado de: $DEPLOY_TARGET"
            firebase deploy --only "$DEPLOY_TARGET" --project luisices-dev --non-interactive --force
          else
            echo "🚀 Realizando deploy geral de functions em luisices-dev..."
            if ! firebase deploy --only functions --project luisices-dev --non-interactive --force; then
              echo "⚠️ Deploy geral atingiu limite de concorrência. Particionando por domínios (cobertura total 63 funções)..."
              sleep 20
              deploy_chunk "WhatsApp" "functions:sendWhatsAppDirectMessage,functions:deleteWhatsAppMessage,functions:syncWhatsAppChatMessages,functions:getWhatsAppInstanceStatus,functions:evolutionWhatsAppWebhook,functions:markWhatsAppChatRead,functions:ensureWhatsAppConversation"
              deploy_chunk "Alexa" "functions:approveAlexaDraft,functions:approveAlexaPairing,functions:cancelAlexaDraft,functions:getAlexaIntegrationStatus,functions:revokeAlexaBinding,functions:setAlexaPermission,functions:toggleGlobalAlexaIntegration,functions:alexaWebhook"
              deploy_chunk "E-mail" "functions:cleanupEmailDrafts,functions:resendReceivingWebhook,functions:sendCustomEmail,functions:getEmailUsage"
              deploy_chunk "IA e Mídia" "functions:aiAgentChat,functions:enrichGalleryItemWithAi,functions:enrichStoreProductWithAi,functions:getAiUsage,functions:galleryMedia"
              deploy_chunk "Pedidos e SuperFrete" "functions:createOrder,functions:updateComplexOrder,functions:submitPublicCatalogOrder,functions:getPublicCatalogProducts,functions:calculateSuperfreteShipping,functions:createSuperfreteLabel"
              deploy_chunk "Acompanhamento" "functions:createOrderTrackingLink,functions:listOrderTrackingLinks,functions:revokeOrderTrackingLink,functions:revokeOrderTrackingLinkById,functions:deleteOrderTrackingLink,functions:deleteOrderTrackingLinksBatch,functions:getPublicOrderTracking"
              deploy_chunk "Usuários" "functions:updateUser,functions:recordUserPasswordChange,functions:completeUserInvitation,functions:createUserInvitation,functions:createUser,functions:getUserAccountMetadata,functions:deleteUser,functions:revokeAllSessions,functions:repairUserClaims,functions:registerDeviceSession,functions:revokeDeviceSession,functions:sendAdminPasswordReset,functions:sendPasswordResetEmail,functions:sendVerificationEmail,functions:validateUserInvitation"
              deploy_chunk "MCP" "functions:getMcpSettingsStatus,functions:createMcpApiKey,functions:updateMcpApiKeyScopes,functions:toggleMcpApiKey,functions:revokeMcpApiKey,functions:toggleGlobalMcp,functions:setUserMcpEligibility,functions:revokeMcpSession,functions:getMcpAuditLogs,functions:getMcpOpenApiSchema,functions:chatGptToolsEndpoint"
            fi
          fi

          echo "🧹 Removendo versões de secrets sem funções vinculadas no Secret Manager (Dev)..."
          firebase functions:secrets:prune --project luisices-dev -f --non-interactive


      - name: Deploy Firebase Functions & Rules (Production)
        if: steps.env.outputs.target == 'prod'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD || secrets.PROD_FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
          GCLOUD_PROJECT: papelaria-dashboard
          SENTRY_DSN: ${{ secrets.PROD_FUNCTIONS_SENTRY_DSN || secrets.PROD_SENTRY_DSN || secrets.PROD_VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY || secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.PROD_RESEND_WEBHOOK_SECRET || secrets.RESEND_WEBHOOK_SECRET }}
          EVOLUTION_API_KEY: ${{ secrets.PROD_EVOLUTION_API_KEY || secrets.EVOLUTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.PROD_GEMINI || secrets.prod_gemini || secrets.PROD_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          ORIGIN_SECRET: ${{ secrets.PROD_ORIGIN_SECRET || secrets.ORIGIN_SECRET }}
          ALEXA_HMAC: ${{ secrets.PROD_ALEXA_IDENTITY_HMAC_KEY || secrets.ALEXA_IDENTITY_HMAC_KEY }}
          ALEXA_SKILL_ID: ${{ secrets.PROD_ALEXA_SKILL_ID || secrets.ALEXA_PROD_SKILL_ID || secrets.ALEXA_SKILL_ID }}
          ORDER_TRACKING_ENCRYPTION_KEY: ${{ secrets.PROD_ORDER_TRACKING_ENCRYPTION_KEY }}
        run: |
          trap 'rm -f functions/.env.papelaria-dashboard "$HOME/order_tracking_encryption_key.txt" "$HOME/origin_secret_prod.txt"' EXIT
          if [ -n "$SENTRY_DSN" ]; then
            printf 'SENTRY_DSN=%s\nSENTRY_ENVIRONMENT=production\n' "$SENTRY_DSN" > functions/.env.papelaria-dashboard
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ ERRO: Secret FIREBASE_SERVICE_ACCOUNT_PROD não encontrado no GitHub."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"
          firebase use papelaria-dashboard --project papelaria-dashboard --non-interactive

          if [ -z "$ORIGIN_SECRET" ]; then
            echo "❌ PROD_ORIGIN_SECRET / ORIGIN_SECRET é obrigatório para proteger as funções callable."
            exit 1
          fi

          deploy_chunk() {
            local label="$1"
            local targets="$2"
            echo "📦 Deploying $label: $targets"
            if ! firebase deploy --only "$targets" --project papelaria-dashboard --non-interactive --force; then
              echo "⚠️ Falha temporária em $label. Aguardando 25s para esvaziar fila de workers e tentando novamente..."
              sleep 25
              firebase deploy --only "$targets" --project papelaria-dashboard --non-interactive --force
            fi
          }

          node <<'NODE'
          const checks = [
            { name: 'FIREBASE_SERVICE_ACCOUNT_PROD', val: process.env.FIREBASE_SERVICE_ACCOUNT, required: true },
            { name: 'PROD_RESEND_API_KEY / RESEND_API_KEY', val: process.env.RESEND_API_KEY, required: true },
            { name: 'PROD_RESEND_WEBHOOK_SECRET / RESEND_WEBHOOK_SECRET', val: process.env.RESEND_WEBHOOK_SECRET, required: false },
            { name: 'PROD_EVOLUTION_API_KEY / EVOLUTION_API_KEY', val: process.env.EVOLUTION_API_KEY, required: true },
            { name: 'PROD_GEMINI / PROD_GEMINI_API_KEY / GEMINI_API_KEY', val: process.env.GEMINI_API_KEY, required: true },
            { name: 'PROD_ORIGIN_SECRET / ORIGIN_SECRET', val: process.env.ORIGIN_SECRET, required: true },
            { name: 'PROD_ALEXA_IDENTITY_HMAC_KEY / ALEXA_IDENTITY_HMAC_KEY', val: process.env.ALEXA_HMAC, required: false },
            { name: 'PROD_ALEXA_SKILL_ID / ALEXA_PROD_SKILL_ID', val: process.env.ALEXA_SKILL_ID, required: false }
          ];

          console.log('\n=============================================================');
          console.log('🔍 RELATÓRIO DE AUDITORIA DE SECRETS DAS FUNCTIONS (PRODUÇÃO)');
          console.log('=============================================================');
          for (const item of checks) {
            const hasVal = typeof item.val === 'string' && item.val.trim().length > 0;
            if (hasVal) {
              const preview = item.name.includes('ORIGIN_SECRET')
                ? `(${item.val.length} chars; valor oculto)`
                : item.val.length > 8
                ? `${item.val.substring(0, 14)}...${item.val.substring(item.val.length - 4)} (${item.val.length} chars)`
                : `(${item.val.length} chars)`;
              console.log(`✅ ${item.name.padEnd(52)}: PRESENTE ${preview}`);
            } else {
              if (item.required) {
                console.log(`❌ ${item.name.padEnd(52)}: AUSENTE (OBRIGATÓRIO)`);
              } else {
                console.log(`⚪ ${item.name.padEnd(52)}: OPCIONAL (não configurado)`);
              }
            }
          }
          console.log('=============================================================\n');
          NODE

          # Em workflow_dispatch, atualiza segredos somente se selecionado.
          # No deploy automático por merge, mantém os valores do Secret Manager como estão.
          if [ "${{ inputs.update_secrets }}" = "true" ]; then
            echo "🔐 Atualizando secrets no Google Secret Manager (Prod)..."
            if [ -n "$RESEND_API_KEY" ]; then
              echo "$RESEND_API_KEY" > "$HOME/resend_api_key.txt"
              firebase functions:secrets:set RESEND_API_KEY --project papelaria-dashboard --data-file "$HOME/resend_api_key.txt" --non-interactive --force || true
            fi
            if [ -n "$EVOLUTION_API_KEY" ]; then
              echo "$EVOLUTION_API_KEY" > "$HOME/evolution_api_key.txt"
              firebase functions:secrets:set EVOLUTION_API_KEY --project papelaria-dashboard --data-file "$HOME/evolution_api_key.txt" --non-interactive --force || true
            fi
            if [ -n "$ORDER_TRACKING_ENCRYPTION_KEY" ]; then
              printf '%s' "$ORDER_TRACKING_ENCRYPTION_KEY" > "$HOME/order_tracking_encryption_key.txt"
              firebase functions:secrets:set ORDER_TRACKING_ENCRYPTION_KEY --project papelaria-dashboard --data-file "$HOME/order_tracking_encryption_key.txt" --non-interactive --force
            fi
            if [ -n "$RESEND_WEBHOOK_SECRET" ]; then
              echo "$RESEND_WEBHOOK_SECRET" > "$HOME/resend_webhook.txt"
              firebase functions:secrets:set RESEND_WEBHOOK_SECRET --project papelaria-dashboard --data-file "$HOME/resend_webhook.txt" --non-interactive --force || true
            fi
            if [ -n "$GEMINI_API_KEY" ]; then
              echo "$GEMINI_API_KEY" > "$HOME/gemini_api_key.txt"
              firebase functions:secrets:set GEMINI_API_KEY --project papelaria-dashboard --data-file "$HOME/gemini_api_key.txt" --non-interactive --force || true
            fi
            if [ -n "$ALEXA_HMAC" ]; then
              echo "$ALEXA_HMAC" > "$HOME/alexa_hmac.txt"
              firebase functions:secrets:set ALEXA_IDENTITY_HMAC_KEY --project papelaria-dashboard --data-file "$HOME/alexa_hmac.txt" --non-interactive --force || true
            fi
            if [ -n "$ORIGIN_SECRET" ]; then
              printf '%s' "$ORIGIN_SECRET" > "$HOME/origin_secret_prod.txt"
              firebase functions:secrets:set ORIGIN_SECRET --project papelaria-dashboard --data-file "$HOME/origin_secret_prod.txt" --non-interactive --force
            fi
          fi

          if ! firebase functions:secrets:get ORDER_TRACKING_ENCRYPTION_KEY --project papelaria-dashboard --non-interactive > /dev/null 2>&1; then
            if [ -z "$ORDER_TRACKING_ENCRYPTION_KEY" ]; then
              echo "❌ Configure PROD_ORDER_TRACKING_ENCRYPTION_KEY no GitHub ou no Secret Manager do projeto papelaria-dashboard antes do deploy."
              exit 1
            fi
            printf '%s' "$ORDER_TRACKING_ENCRYPTION_KEY" > "$HOME/order_tracking_encryption_key.txt"
            firebase functions:secrets:set ORDER_TRACKING_ENCRYPTION_KEY --project papelaria-dashboard --data-file "$HOME/order_tracking_encryption_key.txt" --non-interactive --force
          fi

          if [ -n "$ALEXA_HMAC" ] && ! firebase functions:secrets:get ALEXA_IDENTITY_HMAC_KEY --project papelaria-dashboard --non-interactive > /dev/null 2>&1; then
            echo "🔐 Inicializando ALEXA_IDENTITY_HMAC_KEY no Secret Manager (Prod)..."
            echo "$ALEXA_HMAC" > "$HOME/alexa_hmac.txt"
            firebase functions:secrets:set ALEXA_IDENTITY_HMAC_KEY --project papelaria-dashboard --data-file "$HOME/alexa_hmac.txt" --non-interactive --force || true
          fi

          if ! firebase functions:secrets:get ORIGIN_SECRET --project papelaria-dashboard --non-interactive > /dev/null 2>&1; then
            echo "🔐 Inicializando ORIGIN_SECRET no Secret Manager (Prod)..."
            printf '%s' "$ORIGIN_SECRET" > "$HOME/origin_secret_prod.txt"
            firebase functions:secrets:set ORIGIN_SECRET --project papelaria-dashboard --data-file "$HOME/origin_secret_prod.txt" --non-interactive --force
          fi

          if [ -n "$GEMINI_API_KEY" ] && ! firebase functions:secrets:get GEMINI_API_KEY --project papelaria-dashboard --non-interactive > /dev/null 2>&1; then
            echo "🔐 Inicializando GEMINI_API_KEY no Secret Manager (Prod)..."
            echo "$GEMINI_API_KEY" > "$HOME/gemini_api_key.txt"
            firebase functions:secrets:set GEMINI_API_KEY --project papelaria-dashboard --data-file "$HOME/gemini_api_key.txt" --non-interactive --force || true
          fi

          if [ -n "$RESEND_API_KEY" ] && ! firebase functions:secrets:get RESEND_API_KEY --project papelaria-dashboard --non-interactive > /dev/null 2>&1; then
            echo "🔐 Inicializando RESEND_API_KEY no Secret Manager (Prod)..."
            echo "$RESEND_API_KEY" > "$HOME/resend_api_key.txt"
            firebase functions:secrets:set RESEND_API_KEY --project papelaria-dashboard --data-file "$HOME/resend_api_key.txt" --non-interactive --force || true
          fi

          if [ -n "$EVOLUTION_API_KEY" ] && ! firebase functions:secrets:get EVOLUTION_API_KEY --project papelaria-dashboard --non-interactive > /dev/null 2>&1; then
            echo "🔐 Inicializando EVOLUTION_API_KEY no Secret Manager (Prod)..."
            echo "$EVOLUTION_API_KEY" > "$HOME/evolution_api_key.txt"
            firebase functions:secrets:set EVOLUTION_API_KEY --project papelaria-dashboard --data-file "$HOME/evolution_api_key.txt" --non-interactive --force || true
          fi

          if [ -n "$ALEXA_SKILL_ID" ]; then
            echo "🔧 Sincronizando allowedSkillId no Firestore (papelaria-dashboard)..."
            NODE_PATH=functions/node_modules node -e '
              const { initializeApp } = require("firebase-admin/app");
              const { getFirestore } = require("firebase-admin/firestore");
              initializeApp({ projectId: "papelaria-dashboard" });
              getFirestore().doc("integrationSettings/alexa").set({
                allowedSkillId: process.env.ALEXA_SKILL_ID,
                enabled: true
              }, { merge: true }).then(() => {
                console.log("✅ integrationSettings/alexa sincronizado no Firestore com sucesso!");
                process.exit(0);
              }).catch(err => {
                console.warn("⚠️ Aviso ao sincronizar Firestore:", err.message);
                process.exit(0);
              });
            ' || true
          fi

          if [ "${{ inputs.deploy_rules_and_indexes }}" = "true" ]; then
            echo "📄 Publicando regras, índices e storage..."
            firebase deploy --only firestore:rules,firestore:indexes,database,storage --project papelaria-dashboard --non-interactive --force
          fi

          INPUT_FN="${{ inputs.functions_target }}"
          case "$INPUT_FN" in
            *calculateSuperfreteShipping*|*createSuperfreteLabel*|superfrete)
              echo "❌ A integração SuperFrete Sandbox só pode ser publicada no ambiente dev."
              exit 1
              ;;
          esac

          if [ "$INPUT_FN" = "email" ]; then
            echo "📧 Deploy seletivo das Functions de E-mail..."
            deploy_chunk "E-mail" "functions:cleanupEmailDrafts,functions:resendReceivingWebhook,functions:sendCustomEmail,functions:getEmailUsage"
          elif [ "$INPUT_FN" = "whatsapp" ]; then
            echo "💬 Deploy seletivo das Functions do WhatsApp..."
            deploy_chunk "WhatsApp" "functions:sendWhatsAppDirectMessage,functions:deleteWhatsAppMessage,functions:syncWhatsAppChatMessages,functions:getWhatsAppInstanceStatus,functions:evolutionWhatsAppWebhook,functions:markWhatsAppChatRead,functions:ensureWhatsAppConversation"
          elif [ "$INPUT_FN" = "alexa" ]; then
            echo "🗣️ Deploy seletivo das Functions da Alexa..."
            deploy_chunk "Alexa" "functions:approveAlexaDraft,functions:approveAlexaPairing,functions:cancelAlexaDraft,functions:getAlexaIntegrationStatus,functions:revokeAlexaBinding,functions:setAlexaPermission,functions:toggleGlobalAlexaIntegration,functions:alexaWebhook"
          elif [ "$INPUT_FN" = "users" ]; then
            echo "👥 Deploy seletivo das Functions de Usuários..."
            deploy_chunk "Usuários" "functions:updateUser,functions:recordUserPasswordChange,functions:completeUserInvitation,functions:createUserInvitation,functions:createUser,functions:getUserAccountMetadata,functions:deleteUser,functions:revokeAllSessions,functions:repairUserClaims,functions:registerDeviceSession,functions:revokeDeviceSession,functions:sendAdminPasswordReset,functions:sendPasswordResetEmail,functions:sendVerificationEmail,functions:validateUserInvitation"
          elif [ "$INPUT_FN" = "orders" ]; then
            echo "📦 Deploy seletivo das Functions de Pedidos e Acompanhamento..."
            deploy_chunk "Pedidos" "functions:createOrder,functions:updateComplexOrder,functions:submitPublicCatalogOrder,functions:getPublicCatalogProducts,functions:galleryMedia"
            deploy_chunk "Acompanhamento" "functions:createOrderTrackingLink,functions:listOrderTrackingLinks,functions:revokeOrderTrackingLink,functions:revokeOrderTrackingLinkById,functions:deleteOrderTrackingLink,functions:deleteOrderTrackingLinksBatch,functions:getPublicOrderTracking"
          elif [ "$INPUT_FN" = "mcp" ]; then
            echo "🤖 Deploy seletivo das Functions do MCP..."
            deploy_chunk "MCP" "functions:getMcpSettingsStatus,functions:createMcpApiKey,functions:updateMcpApiKeyScopes,functions:toggleMcpApiKey,functions:revokeMcpApiKey,functions:toggleGlobalMcp,functions:setUserMcpEligibility,functions:revokeMcpSession,functions:getMcpAuditLogs,functions:getMcpOpenApiSchema,functions:chatGptToolsEndpoint"
          elif [ "$INPUT_FN" = "ai" ]; then
            echo "🧠 Deploy seletivo das Functions de IA e seus consumidores MCP (chatGptToolsEndpoint e callables)..."
            deploy_chunk "IA" "functions:aiAgentChat,functions:getAiUsage,functions:enrichGalleryItemWithAi,functions:enrichStoreProductWithAi"
            deploy_chunk "MCP" "functions:getMcpSettingsStatus,functions:createMcpApiKey,functions:updateMcpApiKeyScopes,functions:toggleMcpApiKey,functions:revokeMcpApiKey,functions:toggleGlobalMcp,functions:setUserMcpEligibility,functions:revokeMcpSession,functions:getMcpAuditLogs,functions:getMcpOpenApiSchema,functions:chatGptToolsEndpoint"
          elif [ -n "$INPUT_FN" ] && [ "$INPUT_FN" != "all" ] && [ "$INPUT_FN" != "auto" ]; then
            TARGETS=$(echo "$INPUT_FN" | tr ',' ' ' | tr -s ' ')
            DEPLOY_TARGET=""
            for fn in $TARGETS; do
              fn_clean=$(echo "$fn" | sed 's/^functions://')
              if [ -n "$fn_clean" ]; then
                if [ -z "$DEPLOY_TARGET" ]; then
                  DEPLOY_TARGET="functions:$fn_clean"
                else
                  DEPLOY_TARGET="$DEPLOY_TARGET,functions:$fn_clean"
                fi
              fi
            done
            echo "🚀 Realizando deploy direcionado de: $DEPLOY_TARGET"
            firebase deploy --only "$DEPLOY_TARGET" --project papelaria-dashboard --non-interactive --force
          else
            echo "🚀 Realizando deploy de functions em papelaria-dashboard..."
            if ! firebase deploy --only functions --project papelaria-dashboard --non-interactive --force; then
              echo "⚠️ Deploy geral atingiu limite de concorrência. Particionando por domínios (cobertura total 61 funções elegíveis)..."
              sleep 20
              deploy_chunk "WhatsApp" "functions:sendWhatsAppDirectMessage,functions:deleteWhatsAppMessage,functions:syncWhatsAppChatMessages,functions:getWhatsAppInstanceStatus,functions:evolutionWhatsAppWebhook,functions:markWhatsAppChatRead,functions:ensureWhatsAppConversation"
              deploy_chunk "Alexa" "functions:approveAlexaDraft,functions:approveAlexaPairing,functions:cancelAlexaDraft,functions:getAlexaIntegrationStatus,functions:revokeAlexaBinding,functions:setAlexaPermission,functions:toggleGlobalAlexaIntegration,functions:alexaWebhook"
              deploy_chunk "E-mail" "functions:cleanupEmailDrafts,functions:resendReceivingWebhook,functions:sendCustomEmail,functions:getEmailUsage"
              deploy_chunk "IA e Mídia" "functions:aiAgentChat,functions:enrichGalleryItemWithAi,functions:enrichStoreProductWithAi,functions:getAiUsage,functions:galleryMedia"
              deploy_chunk "Pedidos" "functions:createOrder,functions:updateComplexOrder,functions:submitPublicCatalogOrder,functions:getPublicCatalogProducts"
              deploy_chunk "Acompanhamento" "functions:createOrderTrackingLink,functions:listOrderTrackingLinks,functions:revokeOrderTrackingLink,functions:revokeOrderTrackingLinkById,functions:deleteOrderTrackingLink,functions:deleteOrderTrackingLinksBatch,functions:getPublicOrderTracking"
              deploy_chunk "Usuários" "functions:updateUser,functions:recordUserPasswordChange,functions:completeUserInvitation,functions:createUserInvitation,functions:createUser,functions:getUserAccountMetadata,functions:deleteUser,functions:revokeAllSessions,functions:repairUserClaims,functions:registerDeviceSession,functions:revokeDeviceSession,functions:sendAdminPasswordReset,functions:sendPasswordResetEmail,functions:sendVerificationEmail,functions:validateUserInvitation"
              deploy_chunk "MCP" "functions:getMcpSettingsStatus,functions:createMcpApiKey,functions:updateMcpApiKeyScopes,functions:toggleMcpApiKey,functions:revokeMcpApiKey,functions:toggleGlobalMcp,functions:setUserMcpEligibility,functions:revokeMcpSession,functions:getMcpAuditLogs,functions:getMcpOpenApiSchema,functions:chatGptToolsEndpoint"
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🧹 Removendo versões de secrets sem funções vinculadas no Secret Manager (Prod)..."
            firebase functions:secrets:prune --project papelaria-dashboard -f --non-interactive
          else
            echo "ℹ️ Deploy automático: preservando versões antigas de secrets para permitir rollback."
          fi

