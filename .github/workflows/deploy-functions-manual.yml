name: Deploy Firebase Functions & Rules

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de destino'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      functions_target:
        description: 'Selecione o grupo ou função para deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'aiAgentChat,enrichGalleryItemWithAi,enrichStoreProductWithAi,getAiUsage,sendWhatsAppDirectMessage,deleteWhatsAppMessage,syncWhatsAppChatMessages,getWhatsAppInstanceStatus,evolutionWhatsAppWebhook,syncAllOrdersToAiView'
          - 'aiAgentChat,enrichGalleryItemWithAi,enrichStoreProductWithAi,getAiUsage'
          - 'aiAgentChat,enrichGalleryItemWithAi'
          - 'enrichStoreProductWithAi'
          - 'enrichGalleryItemWithAi'
          - 'enrichGalleryItemWithAi,enrichStoreProductWithAi'
          - 'aiAgentChat'
          - 'getAiUsage'
          - 'sendWhatsAppDirectMessage,deleteWhatsAppMessage,syncWhatsAppChatMessages,getWhatsAppInstanceStatus,evolutionWhatsAppWebhook'
          - 'aiAgentChat,sendWhatsAppDirectMessage'
          - 'sendWhatsAppDirectMessage'
          - 'deleteWhatsAppMessage'
          - 'syncWhatsAppChatMessages'
          - 'getWhatsAppInstanceStatus'
          - 'evolutionWhatsAppWebhook'
          - 'syncAllOrdersToAiView'
          - 'sendAdminPasswordReset,sendPasswordResetEmail'
          - 'createUserInvitation,validateUserInvitation,completeUserInvitation'
          - 'createUser,deleteUser'
          - 'sendCustomEmail,getEmailUsage,resendReceivingWebhook'
      deploy_rules_and_indexes:
        description: 'Publicar Firestore Rules e Indexes?'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Determine Target Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="prod"
          else
            TARGET="dev"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Deploy Firebase Functions & Rules (Dev)
        if: steps.env.outputs.target == 'dev'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"
          echo "$RESEND_API_KEY" > "$HOME/resend_api_key.txt"
          echo "$EVOLUTION_API_KEY" > "$HOME/evolution_api_key.txt"
          echo "$GEMINI_API_KEY" > "$HOME/gemini_api_key.txt"
          firebase use luisices-dev --project luisices-dev
          firebase functions:secrets:set RESEND_API_KEY --project luisices-dev --data-file "$HOME/resend_api_key.txt" || true
          firebase functions:secrets:set EVOLUTION_API_KEY --project luisices-dev --data-file "$HOME/evolution_api_key.txt" || true
          if [ -n "$GEMINI_API_KEY" ]; then
            firebase functions:secrets:set GEMINI_API_KEY --project luisices-dev --data-file "$HOME/gemini_api_key.txt" || true
          fi

          # Determina se deve publicar regras, índices e storage
          if [ "${{ inputs.deploy_rules_and_indexes }}" != "false" ]; then
            echo "📄 Publicando regras, índices e storage..."
            firebase deploy --only firestore:rules,firestore:indexes,storage --project luisices-dev
          fi

          # Determina quais funções publicar via seleção
          INPUT_FN="${{ inputs.functions_target }}"
          if [ -z "$INPUT_FN" ] || [ "$INPUT_FN" = "all" ]; then
            DEPLOY_TARGET="functions"
          else
            TARGETS=$(echo "$INPUT_FN" | tr ',' ' ' | tr -s ' ')
            DEPLOY_TARGET=""
            for fn in $TARGETS; do
              fn_clean=$(echo "$fn" | sed 's/^functions://')
              if [ -n "$fn_clean" ]; then
                if [ -z "$DEPLOY_TARGET" ]; then
                  DEPLOY_TARGET="functions:$fn_clean"
                else
                  DEPLOY_TARGET="$DEPLOY_TARGET,functions:$fn_clean"
                fi
              fi
            done
          fi

          echo "🚀 Realizando deploy de: $DEPLOY_TARGET"
          firebase deploy --only "$DEPLOY_TARGET" --project luisices-dev --force

          echo "🧹 Podando versões obsoletas de segredos no Secret Manager (Dev)..."
          firebase functions:secrets:prune --project luisices-dev -f || true

      - name: Deploy Firebase Functions & Rules (Production)
        if: steps.env.outputs.target == 'prod'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD || secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ ERRO: Secret FIREBASE_SERVICE_ACCOUNT_PROD não encontrado no GitHub."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"
          echo "$RESEND_API_KEY" > "$HOME/resend_api_key.txt"
          echo "$EVOLUTION_API_KEY" > "$HOME/evolution_api_key.txt"
          echo "$GEMINI_API_KEY" > "$HOME/gemini_api_key.txt"
          firebase use papelaria-dashboard --project papelaria-dashboard
          firebase functions:secrets:set RESEND_API_KEY --project papelaria-dashboard --data-file "$HOME/resend_api_key.txt" || true
          firebase functions:secrets:set EVOLUTION_API_KEY --project papelaria-dashboard --data-file "$HOME/evolution_api_key.txt" || true
          if [ -n "$GEMINI_API_KEY" ]; then
            firebase functions:secrets:set GEMINI_API_KEY --project papelaria-dashboard --data-file "$HOME/gemini_api_key.txt" || true
          fi

          # Determina se deve publicar regras e índices
          if [ "${{ inputs.deploy_rules_and_indexes }}" != "false" ]; then
            echo "📄 Publicando regras, índices e storage..."
            firebase deploy --only firestore:rules,firestore:indexes,storage --project papelaria-dashboard
          fi

          # Determina quais funções publicar via seleção
          INPUT_FN="${{ inputs.functions_target }}"
          if [ -z "$INPUT_FN" ] || [ "$INPUT_FN" = "all" ]; then
            DEPLOY_TARGET="functions"
          else
            TARGETS=$(echo "$INPUT_FN" | tr ',' ' ' | tr -s ' ')
            DEPLOY_TARGET=""
            for fn in $TARGETS; do
              fn_clean=$(echo "$fn" | sed 's/^functions://')
              if [ -n "$fn_clean" ]; then
                if [ -z "$DEPLOY_TARGET" ]; then
                  DEPLOY_TARGET="functions:$fn_clean"
                else
                  DEPLOY_TARGET="$DEPLOY_TARGET,functions:$fn_clean"
                fi
              fi
            done
          fi

          echo "🚀 Realizando deploy de: $DEPLOY_TARGET"
          firebase deploy --only "$DEPLOY_TARGET" --project papelaria-dashboard --force

          echo "🧹 Podando versões obsoletas de segredos no Secret Manager (Prod)..."
          firebase functions:secrets:prune --project papelaria-dashboard -f || true
