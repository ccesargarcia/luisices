name: Deploy to GitHub Pages (Production)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/**'
      - 'DEPLOY_PRODUCAO_CHECKLIST.md'

# Define permissões necessárias
permissions:
  contents: write

# Permite apenas um deploy por vez
concurrency:
  group: "pages-production"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔍 Diagnóstico e Auditoria de Secrets (Produção)
        env:
          VITE_API_KEY: ${{ secrets.PROD_VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_AUTH_DOMAIN: ${{ secrets.PROD_VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_PROJECT_ID: ${{ secrets.PROD_VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_STORAGE_BUCKET: ${{ secrets.PROD_VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_MESSAGING_SENDER_ID: ${{ secrets.PROD_VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_APP_ID: ${{ secrets.PROD_VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_MEASUREMENT_ID: ${{ secrets.PROD_VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_DATABASE_URL: ${{ secrets.PROD_VITE_FIREBASE_DATABASE_URL || secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_STORAGE_CDN_URL: ${{ secrets.PROD_VITE_STORAGE_CDN_URL || secrets.VITE_STORAGE_CDN_URL }}
          VITE_FUNCTIONS_CUSTOM_DOMAIN: ${{ secrets.PROD_VITE_FUNCTIONS_CUSTOM_DOMAIN || secrets.VITE_FUNCTIONS_CUSTOM_DOMAIN }}
          VITE_SENTRY_DSN: ${{ secrets.PROD_VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
        run: |
          node <<'NODE'
          const checks = [
            { name: 'PROD_VITE_FIREBASE_API_KEY / VITE_FIREBASE_API_KEY', val: process.env.VITE_API_KEY, required: true },
            { name: 'PROD_VITE_FIREBASE_AUTH_DOMAIN / VITE_FIREBASE_AUTH_DOMAIN', val: process.env.VITE_AUTH_DOMAIN, required: true },
            { name: 'PROD_VITE_FIREBASE_PROJECT_ID / VITE_FIREBASE_PROJECT_ID', val: process.env.VITE_PROJECT_ID, required: true },
            { name: 'PROD_VITE_FIREBASE_STORAGE_BUCKET / VITE_FIREBASE_STORAGE_BUCKET', val: process.env.VITE_STORAGE_BUCKET, required: true },
            { name: 'PROD_VITE_FIREBASE_MESSAGING_SENDER_ID / VITE_FIREBASE_MESSAGING_SENDER_ID', val: process.env.VITE_MESSAGING_SENDER_ID, required: true },
            { name: 'PROD_VITE_FIREBASE_APP_ID / VITE_FIREBASE_APP_ID', val: process.env.VITE_APP_ID, required: true },
            { name: 'PROD_VITE_FIREBASE_MEASUREMENT_ID / VITE_FIREBASE_MEASUREMENT_ID', val: process.env.VITE_MEASUREMENT_ID, required: false },
            { name: 'PROD_VITE_FIREBASE_DATABASE_URL / VITE_FIREBASE_DATABASE_URL', val: process.env.VITE_DATABASE_URL, required: false },
            { name: 'PROD_VITE_STORAGE_CDN_URL / VITE_STORAGE_CDN_URL', val: process.env.VITE_STORAGE_CDN_URL, required: false },
            { name: 'PROD_VITE_FUNCTIONS_CUSTOM_DOMAIN / VITE_FUNCTIONS_CUSTOM_DOMAIN', val: process.env.VITE_FUNCTIONS_CUSTOM_DOMAIN, required: false },
            { name: 'PROD_VITE_SENTRY_DSN / VITE_SENTRY_DSN', val: process.env.VITE_SENTRY_DSN, required: false }
          ];

          console.log('\n=============================================================');
          console.log('🔍 RELATÓRIO DE AUDITORIA DE VARIÁVEIS / SECRETS (PRODUÇÃO)');
          console.log('=============================================================');
          let hasMissingRequired = false;
          for (const item of checks) {
            const hasVal = typeof item.val === 'string' && item.val.trim().length > 0;
            if (hasVal) {
              const preview = item.val.length > 8
                ? `${item.val.substring(0, 14)}...${item.val.substring(item.val.length - 4)} (${item.val.length} chars)`
                : `(${item.val.length} chars)`;
              console.log(`✅ ${item.name.padEnd(52)}: PRESENTE ${preview}`);
            } else {
              if (item.required) {
                console.log(`❌ ${item.name.padEnd(52)}: AUSENTE (OBRIGATÓRIO)`);
                hasMissingRequired = true;
              } else {
                console.log(`⚪ ${item.name.padEnd(52)}: OPCIONAL (não configurado)`);
              }
            }
          }
          console.log('=============================================================\n');

          if (hasMissingRequired) {
            console.error('⚠️ ALERTA: Uma ou mais variáveis obrigatórias estão ausentes no GitHub Secrets!');
          }
          NODE

      - name: Create .env.local with secrets
        env:
          API_KEY: ${{ secrets.PROD_VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.PROD_VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.PROD_VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.PROD_VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          MESSAGING_SENDER_ID: ${{ secrets.PROD_VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.PROD_VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          MEASUREMENT_ID: ${{ secrets.PROD_VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          DATABASE_URL: ${{ secrets.PROD_VITE_FIREBASE_DATABASE_URL || secrets.VITE_FIREBASE_DATABASE_URL }}
          STORAGE_CDN_URL: ${{ secrets.PROD_VITE_STORAGE_CDN_URL || secrets.VITE_STORAGE_CDN_URL || 'https://cdn.luisices.com.br' }}
          FUNCTIONS_CUSTOM_DOMAIN: ${{ secrets.PROD_VITE_FUNCTIONS_CUSTOM_DOMAIN || secrets.VITE_FUNCTIONS_CUSTOM_DOMAIN || 'https://api.luisices.com.br' }}
          SENTRY_DSN: ${{ secrets.PROD_VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
        run: |
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$API_KEY" >> .env.local
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$AUTH_DOMAIN" >> .env.local
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$PROJECT_ID" >> .env.local
          printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$STORAGE_BUCKET" >> .env.local
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$MESSAGING_SENDER_ID" >> .env.local
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$APP_ID" >> .env.local
          printf 'VITE_FIREBASE_MEASUREMENT_ID=%s\n' "$MEASUREMENT_ID" >> .env.local
          if [ -n "$DATABASE_URL" ]; then
            printf 'VITE_FIREBASE_DATABASE_URL=%s\n' "$DATABASE_URL" >> .env.local
          fi
          printf 'VITE_STORAGE_CDN_URL=%s\n' "$STORAGE_CDN_URL" >> .env.local
          printf 'VITE_FUNCTIONS_CUSTOM_DOMAIN=%s\n' "$FUNCTIONS_CUSTOM_DOMAIN" >> .env.local
          if [ -n "$SENTRY_DSN" ]; then
            printf 'VITE_SENTRY_DSN=%s\n' "$SENTRY_DSN" >> .env.local
          fi

      - name: Build (production)
        run: npm run build
        env:
          VITE_BASE_PATH: /

      - name: Deploy to GitHub Pages (root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: luisices.com.br
          force_orphan: true
