name: Auditoria de Segurança Local (IA)
run-name: 'Auditoria local — ${{ inputs.mode }} / ${{ inputs.target }}'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operação (benchmark antes da primeira auditoria)
        type: choice
        options: [benchmark, auditoria]
        default: benchmark
        required: true
      target:
        description: Componente a auditar
        type: choice
        options: [todos, firestore_rules, cloud_functions, cloudflare_workers]
        default: todos
        required: true
      max_runners:
        description: Máximo de runners simultâneos (1–20)
        type: number
        default: 20
        required: true

permissions:
  contents: read

concurrency:
  group: security-audit-local
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      models: ${{ steps.describe.outputs.models }}
      shards: ${{ steps.describe.outputs.shards }}
      server_key: ${{ steps.describe.outputs.server_key }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar controles da auditoria
        run: python3 -m unittest discover -s tests/security_audit -v
      - id: describe
        env:
          MODE: ${{ inputs.mode }}
          MAX_RUNNERS: ${{ inputs.max_runners }}
        run: python3 scripts/security_audit/runtime.py describe --mode "$MODE" --max-runners "$MAX_RUNNERS"

  build:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/security-audit/server
          key: ${{ needs.setup.outputs.server_key }}
      - run: python3 scripts/security_audit/runtime.py build
      - uses: actions/upload-artifact@v4
        with:
          name: audit-runtime
          path: .cache/security-audit/server/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  prepare:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.models) }}
    steps:
      - uses: actions/checkout@v4
      - id: keys
        env:
          MODEL: ${{ matrix.model }}
        run: python3 scripts/security_audit/runtime.py keys --model "$MODEL"
      - uses: actions/download-artifact@v4
        with:
          name: audit-runtime
          path: .cache/security-audit/server
      - name: Restaurar permissão do executável
        run: chmod +x .cache/security-audit/server/bin/llama-server
      - uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs.model_path }}
          key: ${{ steps.keys.outputs.model_key }}
      - name: Preparar modelo e manifesto
        env:
          MODEL: ${{ matrix.model }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          SHARDS: ${{ needs.setup.outputs.shards }}
        run: |
          mkdir -p output/security-audit
          nproc > output/security-audit/cpu.txt
          free -h > output/security-audit/memory.txt
          df -h > output/security-audit/disk.txt
          python3 scripts/security_audit/runtime.py model --model "$MODEL"
          python3 scripts/security_audit/runtime.py start --model "$MODEL"
          PLAN_MODE=plan
          if [ "$MODE" = benchmark ]; then PLAN_MODE=benchmark-plan; fi
          python3 scripts/security_audit_llm.py --mode "$PLAN_MODE" --target "$TARGET" --model "$MODEL" --max-runners "$SHARDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manifest-${{ matrix.model }}
          path: output/security-audit/
          if-no-files-found: error
          retention-days: 14

  expand:
    needs: [setup, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: output/manifests
      - id: expand
        run: python3 scripts/security_audit/runtime.py expand --manifests output/manifests

  analyze:
    needs: [expand, setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_runners) }}
      matrix: ${{ fromJSON(needs.expand.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - id: keys
        env:
          MODEL: ${{ matrix.model }}
        run: python3 scripts/security_audit/runtime.py keys --model "$MODEL"
      - uses: actions/download-artifact@v4
        with:
          name: audit-runtime
          path: .cache/security-audit/server
      - name: Restaurar permissão do executável
        run: chmod +x .cache/security-audit/server/bin/llama-server
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.model_path }}
          key: ${{ steps.keys.outputs.model_key }}
      - uses: actions/download-artifact@v4
        with:
          name: manifest-${{ matrix.model }}
          path: output/security-audit
      - name: Analisar lote
        env:
          MODEL: ${{ matrix.model }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 scripts/security_audit/runtime.py model --model "$MODEL"
          python3 scripts/security_audit/runtime.py start --model "$MODEL"
          python3 scripts/security_audit_llm.py --mode run --shard-index "$SHARD" --budget-seconds 3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.model }}-${{ matrix.shard }}
          path: output/security-audit/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: [setup, expand, analyze]
    if: always() && needs.expand.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.models) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manifest-${{ matrix.model }}
          path: output/security-audit
      - uses: actions/download-artifact@v4
        with:
          pattern: audit-${{ matrix.model }}-*
          path: output/security-audit/results
      - name: Consolidar cobertura e achados
        run: python3 scripts/security_audit_llm.py --mode aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-${{ matrix.model }}
          path: |
            output/security-audit/result.json
            output/security-audit/result.md
            output/security-audit/score.json
          if-no-files-found: error
          retention-days: 14

  benchmark_result:
    needs: [setup, aggregate]
    if: always() && inputs.mode == 'benchmark' && needs.setup.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          path: output/security-audit/results
      - name: Selecionar candidato aprovado
        run: python3 scripts/security_audit_llm.py --mode benchmark-select
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-recommendation
          path: output/security-audit/result.json
          if-no-files-found: error
          retention-days: 14
