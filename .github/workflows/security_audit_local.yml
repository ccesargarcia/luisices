name: Auditoria de Segurança Local (IA)
run-name: "🛡️ Auditoria de Segurança Local [${{ inputs.target }}]"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Componente a ser auditado'
        required: true
        type: choice
        options:
          - 'todos'
          - 'firestore_rules'
          - 'cloud_functions'
          - 'cloudflare_workers'
        default: 'todos'

jobs:
  audit_security:
    name: "Auditoria com Qwen 2.5 Coder 7B"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache do modelo local Qwen2.5-Coder-7B Q4
        uses: actions/cache@v4
        with:
          path: models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
          key: qwen25-coder-7b-q4-k-m-v1

      - name: Cache do servidor llama.cpp
        uses: actions/cache@v4
        with:
          path: llama.cpp/build
          key: llama-build-ubuntu-cpu-avx512-v2

      - name: Otimizar Sistema e Memória do Runner
        run: |
          echo "Otimizando memória do runner para o modelo de segurança..."
          sudo systemctl stop docker mysql containerd 2>/dev/null || true
          if [ ! -f /swapfile_tune ]; then
            sudo fallocate -l 8G /swapfile_tune || sudo dd if=/dev/zero of=/swapfile_tune bs=1M count=8192
            sudo chmod 600 /swapfile_tune
            sudo mkswap /swapfile_tune
            sudo swapon /swapfile_tune
          fi
          sudo sysctl -w vm.swappiness=10
          free -h

      - name: Preparar modelo e servidor llama.cpp
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          mkdir -p models
          if [ ! -s models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf ]; then
            echo "Baixando Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf de bartowski/Qwen2.5-Coder-7B-Instruct-GGUF..."
            curl --fail --location --retry 4 --retry-delay 3 \
              "https://huggingface.co/bartowski/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf" \
              -o models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
          fi
          if [ ! -x llama.cpp/build/bin/llama-server ]; then
            echo "Compilando llama-server com aceleração AVX-512 e VNNI..."
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
            cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=OFF -DGGML_AVX512=ON -DGGML_AVX512_VNNI=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
              -DLLAMA_CURL=OFF
            cmake --build llama.cpp/build --config Release --target llama-server --parallel 2
          fi

      - name: Iniciar servidor do modelo local (Modo Turbo)
        run: |
          echo "Subindo llama-server com Qwen 2.5 Coder 7B..."
          taskset -c 0,1 nohup llama.cpp/build/bin/llama-server \
            -m models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf \
            --alias qwen2.5-coder-local --host 127.0.0.1 --port 8080 \
            --ctx-size 8192 --flash-attn on \
            --threads 2 --threads-batch 2 --parallel 1 --cache-prompt --reasoning off --jinja \
            > llama-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              echo "llama-server pronto para auditoria (PID $SERVER_PID)."
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "llama-server encerrou durante o boot. Log:" >&2
              cat llama-server.log >&2
              exit 1
            fi
            sleep 2
          done
          echo "Timeout aguardando llama-server. Log:" >&2
          cat llama-server.log >&2
          exit 1

      - name: Executar Auditoria de Segurança
        env:
          PYTHONUNBUFFERED: "1"
          LOCAL_LLM_URL: "http://127.0.0.1:8080/v1/chat/completions"
          LOCAL_LLM_MODEL: "qwen2.5-coder-local"
        run: |
          python3 scripts/security_audit_llm.py --target "${{ inputs.target }}" --output SECURITY_AUDIT_REPORT.md

      - name: Salvar Relatório de Auditoria como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-seguranca-${{ inputs.target }}
          path: SECURITY_AUDIT_REPORT.md
          retention-days: 30
