name: Playwright Tests
on:
  push:
    branches: [ main, develop, 'feat/*' ]
  pull_request:
    branches: [ main, develop, 'feat/*' ]
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Qual grupo de testes executar (ex: e2e, ci, customers)'
        required: false
        default: 'e2e'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      
    - name: Create .env files
      run: |
        cat << ENV_LOCAL > .env.local
        VITE_FIREBASE_API_KEY=${{ secrets.DEV_VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID=${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID=${{ secrets.DEV_VITE_FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID }}
        ENV_LOCAL
        
        cat << ENV_TEST > .env.test
        TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}
        TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}
        PLAYWRIGHT_BASE_URL=http://localhost:4173
        ENV_TEST

    - name: Build project
      run: npm run build
      
    - name: Run Playwright tests
      run: npm run test:${{ github.event.inputs.test_target || 'e2e' }}
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
