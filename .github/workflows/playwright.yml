name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Qual grupo de testes executar'
        required: true
        type: choice
        options:
          - security
          - e2e
          - critical
          - order-integrity
          - customers
          - orders
          - products
          - quotes
          - lifecycle
          - navigation
          - settings
          - reports
          - gallery
          - exchanges
          - calendar
          - users
          - help
          - audit
          - store
          - store-checkout
          - whatsapp
          - responsive
          - backend-sdk
        default: 'security'

permissions:
  contents: read

concurrency:
  group: "playwright-tests"
  cancel-in-progress: false

jobs:
  backend-sdk:
    if: ${{ inputs.test_target == 'backend-sdk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install existing frontend tooling and backend SDKs
        run: |
          npm ci --legacy-peer-deps
          npm --prefix functions ci
      - name: Install deployment-compatible Firebase CLI
        run: npm install --prefix "$RUNNER_TEMP/firebase-cli" firebase-tools@15.32.1 --no-audit --no-fund
      - name: Verify real Admin SDK and Functions Emulator contracts
        env:
          SDK_TEST_FIREBASE_CLI: ${{ runner.temp }}/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js
        run: node scripts/run-firebase-sdk-tests.mjs --reporter=json --outputFile=test-results/backend-sdk.json
      - name: Verify real HTTP wrappers with SDK token verification
        env:
          SDK_TEST_FIREBASE_CLI: ${{ runner.temp }}/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js
        run: node scripts/run-firebase-sdk-tests.mjs --http-wrapper --reporter=json --outputFile=test-results/backend-sdk-http.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: backend-sdk-results
          path: test-results/backend-sdk*.json

  test:
    if: ${{ inputs.test_target != 'backend-sdk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          npm --prefix functions ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Java (for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Firebase CLI from the project lockfile
        run: npx firebase --version

      - name: Create .env files with DEV secrets
        env:
          API_KEY: ${{ secrets.DEV_VITE_FIREBASE_API_KEY || 'AIzaSy000000000000000000000000000000000' }}
          AUTH_DOMAIN: ${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN || 'localhost' }}
          PROJECT_ID: ${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID || 'luisices-dev' }}
          STORAGE_BUCKET: ${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET || 'luisices-dev.appspot.com' }}
          MESSAGING_SENDER_ID: ${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID || '123456789' }}
          APP_ID: ${{ secrets.DEV_VITE_FIREBASE_APP_ID || '1:123456789:web:abcdef' }}
          MEASUREMENT_ID: ${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID || 'G-XXXXXXXX' }}
          TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'test-user@example.invalid' }}
          TEST_PASS: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          if [ -z "$TEST_PASS" ]; then
            TEST_PASS="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))')"
          fi
          echo "::add-mask::$TEST_PASS"
          printf 'TEST_USER_PASSWORD=%s\n' "$TEST_PASS" >> "$GITHUB_ENV"
          # Criar .env.local apontando para o Emulator Suite
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$API_KEY" >> .env.local
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$AUTH_DOMAIN" >> .env.local
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$PROJECT_ID" >> .env.local
          printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$STORAGE_BUCKET" >> .env.local
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$MESSAGING_SENDER_ID" >> .env.local
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$APP_ID" >> .env.local
          printf 'VITE_FIREBASE_MEASUREMENT_ID=%s\n' "$MEASUREMENT_ID" >> .env.local
          printf 'VITE_USE_FIREBASE_EMULATOR=true\n' >> .env.local
          
          # Criar .env.test
          printf 'TEST_USER_EMAIL=%s\n' "$TEST_EMAIL" >> .env.test
          printf 'TEST_USER_PASSWORD=%s\n' "$TEST_PASS" >> .env.test
          printf 'PLAYWRIGHT_BASE_URL=http://localhost:4173\n' >> .env.test

          # Criar functions/.secret.local para o Functions Emulator não tentar acessar o Secret Manager no GCP
          cat << 'EOF' > functions/.secret.local
          RESEND_API_KEY=mock-resend-key
          EVOLUTION_API_KEY=mock-evolution-key
          RESEND_WEBHOOK_SECRET=mock-webhook-secret
          GEMINI_API_KEY=mock-gemini-key
          SUPERFRETE_SANDBOX_TOKEN=mock-superfrete-token
          ORIGIN_SECRET=mock-origin-secret
          ALEXA_IDENTITY_HMAC_KEY=mock-alexa-hmac-key
          EOF

      - name: Prepare test metrics directory
        run: mkdir -p test-results

      - name: Run Unit Tests (Vitest)
        env:
          TEST_REPORT_DIR: test-results
          TEST_REPORT_NAME: vitest-unit-1
        run: npm run test:unit

      - name: Build (dev)
        run: npm run build

      - name: Run Playwright tests with Firebase Emulator Suite (0 Cloud Reads)
        env:
          CI: true
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'test-user@example.invalid' }}
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/playwright-shard-1.json
          TEST_TARGET: ${{ github.event.inputs.test_target || 'e2e' }}
        run: |
          if [ "$TEST_TARGET" = 'order-integrity' ]; then
            TEST_COMMAND="npx playwright test tests/e2e/orders.spec.ts --grep 'formata preço unitário|preserva total e pagamento|importa pedido com 20 etiquetas' --project=chromium --reporter=html,list,json"
          else
            TEST_COMMAND="npm run test:$TEST_TARGET -- --reporter=html,list,json"
          fi
          npx firebase emulators:exec --only auth,firestore,storage,functions "node scripts/seed-emulator.mjs && $TEST_COMMAND"

      - name: Upload raw test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-metrics-shard-1
          path: test-results/*.json
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  test-trends:
    if: always() && inputs.test_target != 'backend-sdk'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download test metrics
        uses: actions/download-artifact@v4
        with:
          pattern: test-metrics-shard-*
          path: test-results
          merge-multiple: true

      - name: Restore recent test history
        uses: actions/cache/restore@v4
        with:
          path: test-trends/history.json
          key: test-trends-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-trends-${{ github.ref_name }}-
            test-trends-main-

      - name: Generate charts and comparison summary
        id: generate-trends
        env:
          TEST_RESULTS_DIR: test-results
          TEST_TREND_DIR: test-trends
          TEST_TREND_BRANCH: ${{ github.ref_name }}
          TEST_TREND_TARGET: ${{ github.event.inputs.test_target || 'e2e' }}
        run: node scripts/summarize-test-trends.mjs

      - name: Upload test trend charts and history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-trends
          path: test-trends/
          retention-days: 90

      - name: Save history for trusted branch runs
        if: always() && steps.generate-trends.outputs.has_metrics == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: test-trends/history.json
          key: test-trends-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
