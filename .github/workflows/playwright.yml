name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Qual grupo de testes executar'
        required: true
        type: choice
        options:
          - security
          - e2e
          - critical
          - customers
          - orders
          - products
          - quotes
          - lifecycle
          - navigation
          - settings
          - reports
          - gallery
          - exchanges
          - calendar
          - users
          - help
          - audit
          - store
          - whatsapp
          - responsive
        default: 'security'

permissions:
  contents: read

concurrency:
  group: "playwright-tests"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Unit Tests (Vitest)
        run: npm run test:unit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create .env files with DEV secrets
        env:
          API_KEY: ${{ secrets.DEV_VITE_FIREBASE_API_KEY || 'fake-api-key' }}
          AUTH_DOMAIN: ${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN || 'localhost' }}
          PROJECT_ID: ${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID || 'luisices-dev' }}
          STORAGE_BUCKET: ${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET || 'luisices-dev.appspot.com' }}
          MESSAGING_SENDER_ID: ${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID || '123456789' }}
          APP_ID: ${{ secrets.DEV_VITE_FIREBASE_APP_ID || '1:123456789:web:abcdef' }}
          MEASUREMENT_ID: ${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID || 'G-XXXXXXXX' }}
          TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'teste@luisices.com.br' }}
          TEST_PASS: ${{ secrets.TEST_USER_PASSWORD || 'Senha123456!' }}
        run: |
          # Criar .env.local apontando para o Emulator Suite
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$API_KEY" >> .env.local
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$AUTH_DOMAIN" >> .env.local
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$PROJECT_ID" >> .env.local
          printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$STORAGE_BUCKET" >> .env.local
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$MESSAGING_SENDER_ID" >> .env.local
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$APP_ID" >> .env.local
          printf 'VITE_FIREBASE_MEASUREMENT_ID=%s\n' "$MEASUREMENT_ID" >> .env.local
          printf 'VITE_USE_FIREBASE_EMULATOR=true\n' >> .env.local
          
          # Criar .env.test
          printf 'TEST_USER_EMAIL=%s\n' "$TEST_EMAIL" >> .env.test
          printf 'TEST_USER_PASSWORD=%s\n' "$TEST_PASS" >> .env.test
          printf 'PLAYWRIGHT_BASE_URL=http://localhost:4173\n' >> .env.test

      - name: Build (dev)
        run: npm run build

      - name: Run Playwright tests with Firebase Emulator Suite (0 Cloud Reads)
        env:
          CI: true
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'teste@luisices.com.br' }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Senha123456!' }}
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        run: |
          npx firebase emulators:exec --only auth,firestore,storage "node scripts/seed-emulator.mjs && npm run test:${{ github.event.inputs.test_target || 'e2e' }}"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
