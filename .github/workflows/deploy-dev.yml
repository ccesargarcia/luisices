name: Deploy to Firebase Hosting (Dev)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "firebase-dev"
  cancel-in-progress: false

jobs:
  e2e-tests:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip tests]')
    uses: ./.github/workflows/test-actions.yml
    secrets: inherit

  deploy-functions-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Functions (dev)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"
          echo "$RESEND_API_KEY" > "$HOME/resend_api_key.txt"
          firebase use luisices-dev --project luisices-dev
          firebase functions:secrets:set RESEND_API_KEY --project luisices-dev --data-file "$HOME/resend_api_key.txt" --quiet || true
          firebase deploy --only functions --project luisices-dev --force

  deploy:
    needs: e2e-tests
    if: always() && github.event_name == 'push' && needs.e2e-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env.local with DEV secrets
        env:
          API_KEY: ${{ secrets.DEV_VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET }}
          MESSAGING_SENDER_ID: ${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.DEV_VITE_FIREBASE_APP_ID }}
          MEASUREMENT_ID: ${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$API_KEY" >> .env.local
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$AUTH_DOMAIN" >> .env.local
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$PROJECT_ID" >> .env.local
          printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$STORAGE_BUCKET" >> .env.local
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$MESSAGING_SENDER_ID" >> .env.local
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$APP_ID" >> .env.local
          printf 'VITE_FIREBASE_MEASUREMENT_ID=%s\n' "$MEASUREMENT_ID" >> .env.local

      - name: Build (dev)
        run: npm run build

      - name: Deploy to Firebase Hosting (dev.luisices.com.br)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          projectId: luisices-dev
          channelId: live
