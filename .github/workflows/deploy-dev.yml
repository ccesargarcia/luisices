name: Deploy to Firebase (Dev)

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.vscode/**'
      - 'alexa-icons/**'
      - '.github/workflows/deploy-alexa-skill.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/playwright.yml'
      - '.github/workflows/test-actions.yml'
      - '.github/workflows/screen-audit.yml'
      - '.github/workflows/migrate-user.yml'
      - '.github/workflows/deploy-indexes.yml'
      - '.github/workflows/load-test.yml'
      - '.github/workflows/migrate-products.yml'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Alvo de deploy (auto, all, functions-only, hosting-only, rules-only)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - functions-only
          - hosting-only
          - rules-only
      skip_tests:
        description: 'Pular todos os testes (E2E e Unitários)?'
        required: false
        default: true
        type: boolean
      run_e2e:
        description: 'Executar testes E2E do Playwright?'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "firebase-dev"
  cancel-in-progress: false

jobs:
  detect-changes:
    name: 🔍 Detectar Alterações
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.targets.outputs.frontend }}
      functions: ${{ steps.targets.outputs.functions }}
      functions_scope: ${{ steps.targets.outputs.functions_scope }}
      rules: ${{ steps.targets.outputs.rules }}
      need_e2e: ${{ steps.targets.outputs.need_e2e }}
      need_functions_validation: ${{ steps.targets.outputs.need_functions_validation }}
      need_frontend_validation: ${{ steps.targets.outputs.need_frontend_validation }}
      has_changes: ${{ steps.targets.outputs.has_changes }}
      mcp_metadata: ${{ steps.targets.outputs.mcp_metadata }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Na mesma branch, compara com o commit anterior ao push. O padrão
          # compararia develop com main e repetiria deploys de mudanças antigas.
          base: ${{ github.event.before }}
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.*'
              - 'package*.json'
              - 'tsconfig*.json'
            functions:
              - 'functions/**'
              # Este script é executado durante o deploy para sincronizar secrets.
              - 'scripts/sync-secrets-safe.mjs'
            rules:
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'storage.rules'
              - 'database.rules.json'
              - 'firebase.json'
            e2e:
              - 'tests/e2e/**'
              - 'playwright.config.*'
            unit_tests:
              - 'tests/unit/**'
              - 'vitest*.ts'
            integration_tests:
              - 'tests/integration/**'
            mcp_metadata:
              - 'functions/mcp/**'
              - 'cloudflare/api-worker/**'
              - 'public/.well-known/**'
            ci:
              - '.github/workflows/deploy-dev.yml'
              - '.github/workflows/test-actions.yml'
            maintenance:
              - 'scripts/fix-negative-values.mjs'
              - 'scripts/audit-order-integrity.mjs'
              - 'scripts/order-integrity-audit-core.mjs'

      - name: Resolver Alvos e Estratégia de Testes
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.deploy_target || 'auto' }}
          INPUT_SKIP_TESTS: ${{ inputs.skip_tests }}
          INPUT_RUN_E2E: ${{ inputs.run_e2e || false }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BASE_SHA: ${{ github.event.before }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
          FILTER_FUNCTIONS: ${{ steps.filter.outputs.functions }}
          FILTER_RULES: ${{ steps.filter.outputs.rules }}
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          FILTER_UNIT_TESTS: ${{ steps.filter.outputs.unit_tests }}
          FILTER_INTEGRATION_TESTS: ${{ steps.filter.outputs.integration_tests }}
          FILTER_CI: ${{ steps.filter.outputs.ci }}
          FILTER_MAINTENANCE: ${{ steps.filter.outputs.maintenance }}
          FILTER_MCP_METADATA: ${{ steps.filter.outputs.mcp_metadata }}
        run: |
          # 1. Identificar flags na mensagem do commit e inputs
          SKIP_TESTS=false
          SKIP_E2E=false
          ONLY_FUNCTIONS=false
          ONLY_HOSTING=false
          FORCE_ALL=false

          if [ "$INPUT_SKIP_TESTS" = "true" ] || echo "$COMMIT_MSG" | grep -qiE '\[skip tests\]|\[skip-tests\]'; then
            SKIP_TESTS=true
          fi
          if [ "$INPUT_RUN_E2E" = "false" ] && [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SKIP_E2E=true
          fi
          if echo "$COMMIT_MSG" | grep -qiE '\[skip e2e\]|\[skip-e2e\]|\[fast\]'; then
            SKIP_E2E=true
          fi
          if echo "$COMMIT_MSG" | grep -qiE '\[only functions\]|\[only-functions\]'; then
            ONLY_FUNCTIONS=true
          fi
          if echo "$COMMIT_MSG" | grep -qiE '\[only hosting\]|\[only-hosting\]'; then
            ONLY_HOSTING=true
          fi
          if echo "$COMMIT_MSG" | grep -qiE '\[deploy all\]|\[all\]'; then
            FORCE_ALL=true
          fi

          # 2. Determinar alvos de deploy
          if [ "$INPUT_TARGET" = "functions-only" ] || [ "$ONLY_FUNCTIONS" = "true" ]; then
            DEPLOY_FRONTEND=false
            DEPLOY_FUNCTIONS=true
            DEPLOY_RULES=false
          elif [ "$INPUT_TARGET" = "hosting-only" ] || [ "$ONLY_HOSTING" = "true" ]; then
            DEPLOY_FRONTEND=true
            DEPLOY_FUNCTIONS=false
            DEPLOY_RULES=false
          elif [ "$INPUT_TARGET" = "rules-only" ]; then
            DEPLOY_FRONTEND=false
            DEPLOY_FUNCTIONS=false
            DEPLOY_RULES=true
          elif [ "$INPUT_TARGET" = "all" ] || [ "$FORCE_ALL" = "true" ]; then
            DEPLOY_FRONTEND=true
            DEPLOY_FUNCTIONS=true
            DEPLOY_RULES=true
          else
            # Modo auto baseado nas alterações detectadas
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              DEPLOY_FRONTEND=true
              DEPLOY_FUNCTIONS=true
              DEPLOY_RULES=true
            else
              DEPLOY_FRONTEND="$FILTER_FRONTEND"
              DEPLOY_FUNCTIONS="$FILTER_FUNCTIONS"
              DEPLOY_RULES="$FILTER_RULES"
            fi
          fi

          # Implanta só os exports da SuperFrete quando esse for o único arquivo de Functions alterado.
          FUNCTIONS_SCOPE=none
          if [ "$DEPLOY_FUNCTIONS" = "true" ]; then
            FUNCTIONS_SCOPE=all
            if [ "$EVENT_NAME" = "push" ] && [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
              CHANGED_FUNCTION_FILES=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- functions/)
              if [ "$CHANGED_FUNCTION_FILES" = "functions/orders/superfrete.js" ]; then
                FUNCTIONS_SCOPE=superfrete
              fi
            fi
          fi

          # 3. Determinar se testes E2E do Playwright são necessários
          NEED_E2E=false
          if [ "$SKIP_TESTS" != "true" ] && [ "$SKIP_E2E" != "true" ] && [ "$ONLY_FUNCTIONS" != "true" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              if [ "$INPUT_RUN_E2E" = "true" ]; then
                NEED_E2E=true
              fi
            else
              if [ "$FORCE_ALL" = "true" ] || [ "$DEPLOY_FRONTEND" = "true" ] || [ "$DEPLOY_RULES" = "true" ] || [ "$FILTER_E2E" = "true" ] || [ "$FILTER_INTEGRATION_TESTS" = "true" ]; then
                NEED_E2E=true
              fi
            fi
          fi

          # 4. Determinar se validação rápida de functions/unitária é necessária
          NEED_FUNCTIONS_VALIDATION=false
          if [ "$SKIP_TESTS" != "true" ] && [ "$NEED_E2E" != "true" ]; then
            if [ "$DEPLOY_FUNCTIONS" = "true" ] || [ "$FILTER_UNIT_TESTS" = "true" ] || [ "$FILTER_CI" = "true" ] || [ "$FILTER_MAINTENANCE" = "true" ]; then
              NEED_FUNCTIONS_VALIDATION=true
            fi
          fi

          # Mudanças de pipeline validam o build sem publicar o Hosting.
          NEED_FRONTEND_VALIDATION=false
          if [ "$FILTER_CI" = "true" ] && [ "$FILTER_FRONTEND" != "true" ]; then
            NEED_FRONTEND_VALIDATION=true
          fi

          # 5. Determinar se há algo para deployar
          HAS_CHANGES=false
          if [ "$DEPLOY_FRONTEND" = "true" ] || [ "$DEPLOY_FUNCTIONS" = "true" ] || [ "$DEPLOY_RULES" = "true" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            HAS_CHANGES=true
          fi

          echo "frontend=$DEPLOY_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "functions=$DEPLOY_FUNCTIONS" >> "$GITHUB_OUTPUT"
          echo "functions_scope=$FUNCTIONS_SCOPE" >> "$GITHUB_OUTPUT"
          echo "rules=$DEPLOY_RULES" >> "$GITHUB_OUTPUT"
          echo "need_e2e=$NEED_E2E" >> "$GITHUB_OUTPUT"
          echo "need_functions_validation=$NEED_FUNCTIONS_VALIDATION" >> "$GITHUB_OUTPUT"
          echo "need_frontend_validation=$NEED_FRONTEND_VALIDATION" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "mcp_metadata=$FILTER_MCP_METADATA" >> "$GITHUB_OUTPUT"

          echo "============================================="
          echo "🎯 Estratégia de Execução da Pipeline:"
          echo " - Deploy Frontend: $DEPLOY_FRONTEND"
          echo " - Deploy Functions: $DEPLOY_FUNCTIONS"
          echo " - Escopo Functions: $FUNCTIONS_SCOPE"
          echo " - Deploy Rules: $DEPLOY_RULES"
          echo " - Executar E2E (Playwright): $NEED_E2E"
          echo " - Executar Validação Rápida: $NEED_FUNCTIONS_VALIDATION"
          echo " - Validar build sem deploy: $NEED_FRONTEND_VALIDATION"
          echo " - Mudanças para Deploy: $HAS_CHANGES"
          echo "============================================="

  functions-validation:
    name: ⚡ Validação Rápida (Unit + Lint)
    needs: detect-changes
    if: needs.detect-changes.outputs.need_functions_validation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci --legacy-peer-deps
          npm --prefix functions ci

      - name: Configurar Firebase para testes unitários
        env:
          API_KEY: ${{ secrets.DEV_VITE_FIREBASE_API_KEY || 'AIzaSy000000000000000000000000000000000' }}
          AUTH_DOMAIN: ${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN || 'localhost' }}
          PROJECT_ID: ${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID || 'luisices-dev' }}
          STORAGE_BUCKET: ${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET || 'luisices-dev.appspot.com' }}
          MESSAGING_SENDER_ID: ${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID || '123456789' }}
          APP_ID: ${{ secrets.DEV_VITE_FIREBASE_APP_ID || '1:123456789:web:abcdef' }}
          MEASUREMENT_ID: ${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID || 'G-XXXXXXXX' }}
        run: |
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$API_KEY" >> .env.local
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$AUTH_DOMAIN" >> .env.local
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$PROJECT_ID" >> .env.local
          printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$STORAGE_BUCKET" >> .env.local
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$MESSAGING_SENDER_ID" >> .env.local
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$APP_ID" >> .env.local
          printf 'VITE_FIREBASE_MEASUREMENT_ID=%s\n' "$MEASUREMENT_ID" >> .env.local
          printf 'VITE_USE_FIREBASE_EMULATOR=true\n' >> .env.local

      - name: Lint Functions
        run: npm --prefix functions run lint

      - name: Preparar métricas dos testes
        run: mkdir -p test-results

      - name: Executar Testes Unitários (Vitest)
        env:
          TEST_REPORT_DIR: test-results
          TEST_REPORT_NAME: vitest-unit-1
        run: npm run test:unit

      - name: Publicar métricas dos testes unitários
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-metrics-unit
          path: test-results/vitest-unit-1.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Validar build do Frontend sem publicar
        if: needs.detect-changes.outputs.need_frontend_validation == 'true'
        run: npm run build

  unit-test-trends:
    if: always() && needs.functions-validation.result != 'skipped'
    needs: functions-validation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Baixar métricas unitárias
        uses: actions/download-artifact@v4
        with:
          pattern: test-metrics-unit
          path: test-results
          merge-multiple: true

      - name: Restaurar histórico recente
        uses: actions/cache/restore@v4
        with:
          path: test-trends/history.json
          key: test-trends-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-trends-${{ github.ref_name }}-
            test-trends-main-

      - name: Gerar gráfico e comparação
        id: generate-trends
        env:
          TEST_RESULTS_DIR: test-results
          TEST_TREND_DIR: test-trends
          TEST_TREND_BRANCH: ${{ github.ref_name }}
          TEST_TREND_TARGET: unit
        run: node scripts/summarize-test-trends.mjs

      - name: Publicar gráfico e histórico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-trends
          path: test-trends/
          retention-days: 90

      - name: Salvar histórico da branch
        if: always() && steps.generate-trends.outputs.has_metrics == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: test-trends/history.json
          key: test-trends-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  e2e-tests:
    name: 🧪 Testes E2E Completos (Playwright)
    needs: detect-changes
    if: needs.detect-changes.outputs.need_e2e == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/test-actions.yml
    secrets: inherit

  deploy-frontend:
    name: 🎨 Build e Deploy Frontend (Dev)
    needs: [detect-changes, e2e-tests]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar dependências do Frontend
        run: npm ci --legacy-peer-deps

      - name: Criar .env.local com secrets de DEV
        env:
          API_KEY: ${{ secrets.DEV_VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET }}
          MESSAGING_SENDER_ID: ${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.DEV_VITE_FIREBASE_APP_ID }}
          MEASUREMENT_ID: ${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID }}
          DATABASE_URL: ${{ secrets.DEV_VITE_FIREBASE_DATABASE_URL }}
          STORAGE_CDN_URL: ${{ secrets.DEV_VITE_STORAGE_CDN_URL || 'https://cdn-dev.luisices.com.br' }}
          FUNCTIONS_CUSTOM_DOMAIN: ${{ secrets.DEV_VITE_FUNCTIONS_CUSTOM_DOMAIN || 'https://api.dev.luisices.com.br' }}
          SENTRY_DSN: ${{ secrets.DEV_VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN || secrets.SENTRY_DSN }}
        run: |
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$API_KEY" >> .env.local
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$AUTH_DOMAIN" >> .env.local
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$PROJECT_ID" >> .env.local
          printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$STORAGE_BUCKET" >> .env.local
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$MESSAGING_SENDER_ID" >> .env.local
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$APP_ID" >> .env.local
          printf 'VITE_FIREBASE_MEASUREMENT_ID=%s\n' "$MEASUREMENT_ID" >> .env.local
          if [ -n "$DATABASE_URL" ]; then
            printf 'VITE_FIREBASE_DATABASE_URL=%s\n' "$DATABASE_URL" >> .env.local
          fi
          printf 'VITE_STORAGE_CDN_URL=%s\n' "$STORAGE_CDN_URL" >> .env.local
          printf 'VITE_FUNCTIONS_CUSTOM_DOMAIN=%s\n' "$FUNCTIONS_CUSTOM_DOMAIN" >> .env.local
          if [ -n "$SENTRY_DSN" ]; then
            printf 'VITE_SENTRY_DSN=%s\n' "$SENTRY_DSN" >> .env.local
          fi

      - name: Build Frontend (dev)
        run: npm run build

      - name: Validar conta de deploy do Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          node <<'NODE'
          let credentials;
          try {
            credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '');
          } catch {
            console.error('FIREBASE_SERVICE_ACCOUNT_DEV ausente ou com JSON inválido.');
            process.exit(1);
          }
          const serviceAccountEmail = credentials?.client_email;
          if (typeof serviceAccountEmail !== 'string' || !/^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.gserviceaccount\.com$/.test(serviceAccountEmail)) {
            console.error('O secret não contém um client_email válido de conta de serviço.');
            process.exit(1);
          }
          console.log('Conta de serviço validada.');
          NODE

      - name: Deploy Firebase Hosting (dev.luisices.com.br)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"
          npx --yes firebase-tools@15.32.1 deploy --only hosting --project luisices-dev --non-interactive

  deploy:
    name: 🚀 Deploy Rules e Functions (Dev)
    needs: [detect-changes, e2e-tests, functions-validation]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      (needs.functions-validation.result == 'success' || needs.functions-validation.result == 'skipped') &&
      (needs.detect-changes.outputs.functions == 'true' || needs.detect-changes.outputs.rules == 'true' || needs.detect-changes.outputs.mcp_metadata == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # --- AUTENTICAÇÃO DO BACKEND ---
      - name: Identificar conta de deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          node <<'NODE'
          let credentials;
          try {
            credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '');
          } catch {
            console.error('FIREBASE_SERVICE_ACCOUNT_DEV ausente ou com JSON inválido.');
            process.exit(1);
          }
          const serviceAccountEmail = credentials?.client_email;
          if (typeof serviceAccountEmail !== 'string' || !/^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.gserviceaccount\.com$/.test(serviceAccountEmail)) {
            console.error('O secret não contém um client_email válido de conta de serviço.');
            process.exit(1);
          }
          console.log('Conta de serviço validada.');
          NODE

      - name: 🔍 Diagnóstico e Auditoria de Secrets (Dev)
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          VITE_API_KEY: ${{ secrets.DEV_VITE_FIREBASE_API_KEY }}
          VITE_AUTH_DOMAIN: ${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_PROJECT_ID: ${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID }}
          VITE_STORAGE_BUCKET: ${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_MESSAGING_SENDER_ID: ${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_APP_ID: ${{ secrets.DEV_VITE_FIREBASE_APP_ID }}
          VITE_MEASUREMENT_ID: ${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_DATABASE_URL: ${{ secrets.DEV_VITE_FIREBASE_DATABASE_URL }}
          VITE_STORAGE_CDN_URL: ${{ secrets.DEV_VITE_STORAGE_CDN_URL }}
          DEV_ORIGIN_SECRET: ${{ secrets.DEV_ORIGIN_SECRET || secrets.ORIGIN_SECRET }}
          DEV_ALEXA_HMAC: ${{ secrets.DEV_ALEXA_IDENTITY_HMAC_KEY || secrets.ALEXA_IDENTITY_HMAC_KEY }}
          RESEND_API_KEY: ${{ secrets.DEV_RESEND_API_KEY || secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.DEV_RESEND_WEBHOOK_SECRET || secrets.RESEND_WEBHOOK_SECRET }}
          EVOLUTION_API_KEY: ${{ secrets.DEV_EVOLUTION_API_KEY || secrets.EVOLUTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.DEV_GEMINI || secrets.dev_gemini || secrets.DEV_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const checks = [
            { name: 'FIREBASE_SERVICE_ACCOUNT_DEV', val: process.env.SERVICE_ACCOUNT, required: true },
            { name: 'DEV_VITE_FIREBASE_API_KEY', val: process.env.VITE_API_KEY, required: true },
            { name: 'DEV_VITE_FIREBASE_AUTH_DOMAIN', val: process.env.VITE_AUTH_DOMAIN, required: true },
            { name: 'DEV_VITE_FIREBASE_PROJECT_ID', val: process.env.VITE_PROJECT_ID, required: true },
            { name: 'DEV_VITE_FIREBASE_STORAGE_BUCKET', val: process.env.VITE_STORAGE_BUCKET, required: true },
            { name: 'DEV_VITE_FIREBASE_MESSAGING_SENDER_ID', val: process.env.VITE_MESSAGING_SENDER_ID, required: true },
            { name: 'DEV_VITE_FIREBASE_APP_ID', val: process.env.VITE_APP_ID, required: true },
            { name: 'DEV_VITE_FIREBASE_MEASUREMENT_ID', val: process.env.VITE_MEASUREMENT_ID, required: false },
            { name: 'DEV_VITE_FIREBASE_DATABASE_URL', val: process.env.VITE_DATABASE_URL, required: false },
            { name: 'DEV_VITE_STORAGE_CDN_URL', val: process.env.VITE_STORAGE_CDN_URL, required: false },
            { name: 'DEV_ORIGIN_SECRET / ORIGIN_SECRET', val: process.env.DEV_ORIGIN_SECRET, required: true },
            { name: 'DEV_ALEXA_IDENTITY_HMAC_KEY', val: process.env.DEV_ALEXA_HMAC, required: false },
            { name: 'DEV_RESEND_API_KEY / RESEND_API_KEY', val: process.env.RESEND_API_KEY, required: true },
            { name: 'DEV_RESEND_WEBHOOK_SECRET / RESEND_WEBHOOK_SECRET', val: process.env.RESEND_WEBHOOK_SECRET, required: false },
            { name: 'DEV_EVOLUTION_API_KEY / EVOLUTION_API_KEY', val: process.env.EVOLUTION_API_KEY, required: true },
            { name: 'DEV_GEMINI / DEV_GEMINI_API_KEY', val: process.env.GEMINI_API_KEY, required: true }
          ];

          console.log('\n=============================================================');
          console.log('🔍 RELATÓRIO DE AUDITORIA DE VARIÁVEIS / SECRETS (DEV)');
          console.log('=============================================================');
          let hasMissingRequired = false;
          for (const item of checks) {
            const hasVal = typeof item.val === 'string' && item.val.trim().length > 0;
            if (hasVal) {
              const preview = item.name.includes('ORIGIN_SECRET')
                ? `(${item.val.length} chars; valor oculto)`
                : item.val.length > 8
                ? `${item.val.substring(0, 14)}...${item.val.substring(item.val.length - 4)} (${item.val.length} chars)`
                : `(${item.val.length} chars)`;
              console.log(`✅ ${item.name.padEnd(44)}: PRESENTE ${preview}`);
            } else {
              if (item.required) {
                console.log(`❌ ${item.name.padEnd(44)}: AUSENTE (OBRIGATÓRIO)`);
                hasMissingRequired = true;
              } else {
                console.log(`⚠️  ${item.name.padEnd(44)}: OPCIONAL / NÃO DEFINIDO`);
              }
            }
          }
          console.log('=============================================================\n');
          if (hasMissingRequired) {
            console.error('⚠️ ALERTA: Uma ou mais variáveis obrigatórias estão ausentes no GitHub Secrets!');
          }
          NODE

      # --- ETAPAS DE REGRAS (FIRESTORE & STORAGE) ---
      - name: Deploy Firestore & Storage Rules (Dev)
        if: needs.detect-changes.outputs.rules == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"
          if ! npx --yes firebase-tools@15.32.1 deploy --only firestore:rules,firestore:indexes,database,storage --project luisices-dev --non-interactive; then
            echo "⚠️ Deploy com database falhou (possível ausência da instância RTDB em dev). Tentando deploy de Firestore e Storage..."
            npx --yes firebase-tools@15.32.1 deploy --only firestore:rules,firestore:indexes,storage --project luisices-dev --non-interactive
          fi

      # --- ETAPAS DAS CLOUD FUNCTIONS ---
      - name: Instalar dependências de Functions
        if: needs.detect-changes.outputs.functions == 'true'
        working-directory: functions
        run: npm ci

      - name: Sincronizar Secrets no Secret Manager (Dev)
        if: needs.detect-changes.outputs.functions == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          ORIGIN_SECRET: ${{ secrets.DEV_ORIGIN_SECRET || secrets.ORIGIN_SECRET }}
          ALEXA_HMAC: ${{ secrets.DEV_ALEXA_IDENTITY_HMAC_KEY || secrets.ALEXA_IDENTITY_HMAC_KEY }}
          RESEND_API_KEY: ${{ secrets.DEV_RESEND_API_KEY || secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.DEV_RESEND_WEBHOOK_SECRET || secrets.RESEND_WEBHOOK_SECRET }}
          EVOLUTION_API_KEY: ${{ secrets.DEV_EVOLUTION_API_KEY || secrets.EVOLUTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.DEV_GEMINI || secrets.dev_gemini || secrets.DEV_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          SUPERFRETE_SANDBOX_TOKEN: ${{ secrets.SUPERFRETE_SANDBOX_TOKEN }}
          ORDER_TRACKING_ENCRYPTION_KEY: ${{ secrets.DEV_ORDER_TRACKING_ENCRYPTION_KEY }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"

          if [ -z "$SUPERFRETE_SANDBOX_TOKEN" ]; then
            echo "❌ SUPERFRETE_SANDBOX_TOKEN não configurada nos GitHub Actions Secrets."
            exit 1
          fi

          echo "🔒 Sincronizando segredos no Google Secret Manager de forma idempotente..."
          node scripts/sync-secrets-safe.mjs --project=luisices-dev

      - name: Deploy Firebase Functions (Dev)
        if: needs.detect-changes.outputs.functions == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          SENTRY_DSN: ${{ secrets.DEV_FUNCTIONS_SENTRY_DSN || secrets.DEV_SENTRY_DSN || secrets.DEV_VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN || secrets.SENTRY_DSN }}
          FUNCTIONS_DEPLOY_SCOPE: ${{ needs.detect-changes.outputs.functions_scope }}
          GCLOUD_PROJECT: luisices-dev
        run: |
          trap 'rm -f functions/.env.luisices-dev' EXIT
          if [ -n "$SENTRY_DSN" ]; then
            printf 'SENTRY_DSN=%s\nSENTRY_ENVIRONMENT=development\n' "$SENTRY_DSN" > functions/.env.luisices-dev
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"

          if [ "$FUNCTIONS_DEPLOY_SCOPE" = "superfrete" ]; then
            echo "🚚 Deploy seletivo das Functions da SuperFrete..."
            npx --yes firebase-tools@15.32.1 deploy --only "functions:calculateSuperfreteShipping,functions:createSuperfreteLabel" --project luisices-dev --non-interactive
          elif ! npx --yes firebase-tools@15.32.1 deploy --only functions --project luisices-dev --non-interactive; then
            echo "⚠️ Deploy em lote geral atingiu limite de concorrência. Executando deploy particionado por módulos..."
            npx --yes firebase-tools@15.32.1 deploy --only "functions:sendWhatsAppDirectMessage,functions:deleteWhatsAppMessage,functions:syncWhatsAppChatMessages,functions:getWhatsAppInstanceStatus,functions:evolutionWhatsAppWebhook,functions:markWhatsAppChatRead,functions:ensureWhatsAppConversation" --project luisices-dev --non-interactive
            npx --yes firebase-tools@15.32.1 deploy --only "functions:aiAgentChat,functions:enrichGalleryItemWithAi,functions:enrichStoreProductWithAi,functions:getAiUsage,functions:syncAllOrdersToAiView,functions:submitPublicCatalogOrder,functions:calculateSuperfreteShipping,functions:createSuperfreteLabel,functions:galleryMedia" --project luisices-dev --non-interactive
            npx --yes firebase-tools@15.32.1 deploy --only "functions:cleanupEmailDrafts,functions:resendReceivingWebhook,functions:sendCustomEmail,functions:getEmailUsage" --project luisices-dev --non-interactive
            npx --yes firebase-tools@15.32.1 deploy --only "functions:approveAlexaDraft,functions:approveAlexaPairing,functions:cancelAlexaDraft,functions:getAlexaIntegrationStatus,functions:revokeAlexaBinding,functions:setAlexaPermission,functions:toggleGlobalAlexaIntegration,functions:alexaWebhook" --project luisices-dev --non-interactive
            npx --yes firebase-tools@15.32.1 deploy --only "functions:updateUser,functions:recordUserPasswordChange,functions:completeUserInvitation,functions:createUserInvitation,functions:createUser,functions:getUserAccountMetadata,functions:deleteUser,functions:revokeAllSessions,functions:repairUserClaims,functions:registerDeviceSession,functions:revokeDeviceSession" --project luisices-dev --non-interactive
            npx --yes firebase-tools@15.32.1 deploy --only "functions:getMcpSettingsStatus,functions:createMcpApiKey,functions:toggleMcpApiKey,functions:revokeMcpApiKey,functions:toggleGlobalMcp,functions:setUserMcpEligibility,functions:chatGptToolsEndpoint" --project luisices-dev --non-interactive
          fi

          echo "🧹 Removendo versões de secrets sem funções vinculadas no Secret Manager (Dev)..."
          npx --yes firebase-tools@15.32.1 functions:secrets:prune --project luisices-dev --force --non-interactive

      - name: Purgar Cache da Borda Cloudflare (OpenAPI & Manifestos MCP)
        if: needs.detect-changes.outputs.mcp_metadata == 'true' || inputs.deploy_target == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "🧹 Alterações detectadas em rotas/schemas do MCP. Purgando cache da borda na Cloudflare (Dev)..."
          node scripts/purge-cloudflare-cache.mjs dev
