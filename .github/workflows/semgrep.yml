name: Semgrep

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'api/**'
      - 'cloudflare/**'
      - '.semgrep/**'
      - '.github/workflows/semgrep.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'api/**'
      - 'cloudflare/**'
      - '.semgrep/**'
      - '.github/workflows/semgrep.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Send scan to Semgrep Cloud (SaaS)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "SEMGREP_APP_TOKEN não configurado; pulando envio ao Semgrep Cloud."
            exit 0
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v "${GITHUB_EVENT_PATH}:${GITHUB_EVENT_PATH}:ro" \
            --workdir /src \
            -e SEMGREP_APP_TOKEN \
            -e GITHUB_TOKEN \
            -e GITHUB_ACTIONS \
            -e GITHUB_REPOSITORY \
            -e GITHUB_REF \
            -e GITHUB_REF_NAME \
            -e GITHUB_HEAD_REF \
            -e GITHUB_BASE_REF \
            -e GITHUB_SHA \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_EVENT_PATH \
            -e GITHUB_RUN_ID \
            -e GITHUB_SERVER_URL \
            semgrep/semgrep:latest \
            semgrep ci

      - name: Run Semgrep scan (SARIF)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            --workdir /src \
            semgrep/semgrep:latest \
            semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/react \
            --config p/nodejs \
            --config p/secrets \
            --config .semgrep/luisices.yml \
            --metrics=off \
            --sarif \
            --output=semgrep.sarif \
            src functions api cloudflare

      - name: Upload Semgrep SARIF to GitHub Security
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Enforce zero ERROR findings on Luisices custom & secrets rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            --workdir /src \
            semgrep/semgrep:latest \
            semgrep scan \
            --config .semgrep/luisices.yml \
            --config p/secrets \
            --severity ERROR \
            --error \
            --metrics=off \
            src functions api cloudflare
