name: Semgrep

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'api/**'
      - 'cloudflare/**'
      - '.semgrep/**'
      - '.github/workflows/semgrep.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'api/**'
      - 'cloudflare/**'
      - '.semgrep/**'
      - '.github/workflows/semgrep.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Semgrep scan
        uses: docker://semgrep/semgrep:latest
        with:
          args: >-
            semgrep scan
            --config p/typescript
            --config p/javascript
            --config p/react
            --config p/nodejs
            --config p/secrets
            --config .semgrep/luisices.yml
            --metrics=off
            --sarif
            --output=semgrep.sarif
            src functions api cloudflare

      - name: Upload Semgrep SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Enforce zero ERROR findings on Luisices custom & secrets rules
        uses: docker://semgrep/semgrep:latest
        with:
          args: >-
            semgrep scan
            --config .semgrep/luisices.yml
            --config p/secrets
            --severity ERROR
            --error
            --metrics=off
            src functions api cloudflare
