name: Cloudflare - Aplicar Ajustes de Conformidade (Incluindo VPN DNS)

on:
  workflow_dispatch:
    inputs:
      wireguard_ip:
        description: 'IP do WireGuard / Tailscale Galaxy A70 (padrão: 100.97.222.39)'
        required: false
        default: '100.97.222.39'

permissions:
  contents: read

jobs:
  fix-cloudflare:
    name: Aplicar Ajustes na Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Executar Ajustes Automáticos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WIREGUARD_IP: ${{ inputs.wireguard_ip || '100.97.222.39' }}
        run: npm run cloudflare:fix

      - name: Auditar Novo Status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cloudflare:status

