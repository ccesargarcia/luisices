name: Cloudflare - Aplicar Ajustes de Conformidade

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-cloudflare:
    name: Aplicar Ajustes na Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Executar Ajustes Automáticos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cloudflare:fix

      - name: Auditar Novo Status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cloudflare:status
