name: Diagnosticar conta Firebase Dev

on:
  workflow_dispatch:

permissions: {}

jobs:
  identificar-conta:
    name: Identificar conta de deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Identificar conta de deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          node <<'NODE'
          let credentials;
          try {
            credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '');
          } catch {
            console.error('FIREBASE_SERVICE_ACCOUNT_DEV ausente ou com JSON inválido.');
            process.exit(1);
          }
          const serviceAccountEmail = credentials?.client_email;
          if (typeof serviceAccountEmail !== 'string' || !/^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.gserviceaccount\.com$/.test(serviceAccountEmail)) {
            console.error('O secret não contém um client_email válido de conta de serviço.');
            process.exit(1);
          }
          console.log('Conta de serviço validada.');
          NODE

