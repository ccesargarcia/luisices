name: E2E Tests

on:
  workflow_call:
    inputs:
      test_target:
        description: 'Qual grupo de testes executar (ex: all, security, critical)'
        required: false
        type: string
        default: 'all'
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Qual grupo de testes executar'
        required: false
        type: choice
        options:
          - all
          - security
          - critical
          - orders
          - customers
          - products
          - quotes
          - store
          - audit
          - screen-audit
        default: 'all'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: "e2e-tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Unit Tests (Vitest)
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env files with Firebase and test config
        env:
          API_KEY: ${{ secrets.DEV_VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET }}
          MESSAGING_SENDER_ID: ${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.DEV_VITE_FIREBASE_APP_ID }}
          MEASUREMENT_ID: ${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID }}
          TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_PASS: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$API_KEY" >> .env.local
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$AUTH_DOMAIN" >> .env.local
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$PROJECT_ID" >> .env.local
          printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$STORAGE_BUCKET" >> .env.local
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$MESSAGING_SENDER_ID" >> .env.local
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$APP_ID" >> .env.local
          printf 'VITE_FIREBASE_MEASUREMENT_ID=%s\n' "$MEASUREMENT_ID" >> .env.local
          printf 'TEST_USER_EMAIL=%s\n' "$TEST_EMAIL" >> .env.test
          printf 'TEST_USER_PASSWORD=%s\n' "$TEST_PASS" >> .env.test
          printf 'PLAYWRIGHT_BASE_URL=http://localhost:4173\n' >> .env.test

      - name: Build
        run: npm run build

      - name: Run E2E tests
        env:
          CI: true
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          INPUT_TARGET: ${{ inputs.test_target || github.event.inputs.test_target || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        # Permite executar apenas segurança, fluxo crítico ou teste específico via input ou tag [test:security]
        run: |
          if [ "$INPUT_TARGET" = "security" ] || echo "$COMMIT_MSG" | grep -qi '\[test:security\]'; then
            echo "🛡️ Executando exclusivamente testes de segurança..."
            npx playwright test tests/e2e/security.spec.ts --project=chromium --reporter=list,html
          elif [ "$INPUT_TARGET" = "critical" ] || echo "$COMMIT_MSG" | grep -qiE '\[test:critical\]|\[fast\]|\[test:fast\]'; then
            echo "⚡ Executando testes críticos e de segurança..."
            npx playwright test tests/e2e/critical-flows.spec.ts tests/e2e/permissions.spec.ts tests/e2e/security.spec.ts --project=chromium --reporter=list,html
          elif [ -n "$INPUT_TARGET" ] && [ "$INPUT_TARGET" != "all" ]; then
            echo "🎯 Executando target específico: $INPUT_TARGET..."
            npx playwright test tests/e2e/${INPUT_TARGET}.spec.ts --project=chromium --reporter=list,html
          else
            echo "🚀 Executando suíte completa de testes E2E..."
            npx playwright test --project=chromium --reporter=list,html
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test videos & traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          retention-days: 14
