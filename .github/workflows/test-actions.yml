name: E2E Tests

on:
  workflow_call:
    inputs:
      test_target:
        description: 'Qual grupo de testes executar (ex: all, security, critical)'
        required: false
        type: string
        default: 'all'
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Qual grupo de testes executar'
        required: false
        type: choice
        options:
          - all
          - security
          - critical
          - order-integrity
          - orders
          - customers
          - products
          - quotes
          - store
          - store-checkout
          - audit
          - screen-audit
        default: 'all'
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/deploy-dev.yml'
      - '.github/workflows/playwright.yml'
      - '.github/workflows/test-actions.yml'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: "e2e-tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify-promotion:
    name: Verify reusable E2E results
    if: github.workflow == 'E2E Tests' && ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'release/sync-develop-main') || (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      reuse_e2e: ${{ steps.verify.outputs.reuse_e2e }}
    steps:
      - name: Checkout candidate commit and branch history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Fetch current promotion refs
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'release/sync-develop-main'
        run: git fetch --no-tags --unshallow origin refs/heads/main:refs/remotes/origin/main refs/heads/develop:refs/remotes/origin/develop

      - name: Verify prior E2E or environment deployments
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const { canReuseE2E } = require('./scripts/reuse-verified-promotion-e2e.cjs');
            const decision = await canReuseE2E({
              github,
              repo: context.repo,
              context
            });
            core.setOutput('reuse_e2e', decision.reuse ? 'true' : 'false');
            if (decision.reuse) {
              core.notice(`E2E reutilizados: ${decision.reason}.`);
            } else {
              core.info(`E2E serão executados normalmente: ${decision.reason}.`);
            }

  e2e-tests:
    needs: verify-promotion
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Reuse verified E2E results
        if: needs.verify-promotion.result == 'success' && needs.verify-promotion.outputs.reuse_e2e == 'true'
        run: echo 'E2E já aprovados e validados para esta promoção; mantendo o check deste shard como aprovado.'

      - name: Checkout
        if: success() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        uses: actions/checkout@v5

      - name: Setup Node
        if: success() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        if: success() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        run: |
          npm ci --legacy-peer-deps
          npm --prefix functions ci

      - name: Validate deployment workflow contracts
        if: success() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        run: node --test tests/scripts/deployment-workflows.test.mjs tests/scripts/functions-deploy-selection.test.mjs tests/scripts/reuse-verified-promotion-e2e.test.mjs

      - name: Create .env files with Firebase and test config
        if: success() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        env:
          API_KEY: ${{ secrets.DEV_VITE_FIREBASE_API_KEY || 'AIzaSy000000000000000000000000000000000' }}
          AUTH_DOMAIN: ${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN || 'localhost' }}
          PROJECT_ID: ${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID || 'luisices-dev' }}
          STORAGE_BUCKET: ${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET || 'luisices-dev.appspot.com' }}
          MESSAGING_SENDER_ID: ${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID || '123456789' }}
          APP_ID: ${{ secrets.DEV_VITE_FIREBASE_APP_ID || '1:123456789:web:abcdef' }}
          MEASUREMENT_ID: ${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID || 'G-XXXXXXXX' }}
          STORAGE_CDN_URL: ${{ secrets.DEV_VITE_STORAGE_CDN_URL || 'https://cdn-dev.luisices.com.br' }}
          SENTRY_DSN: ${{ secrets.DEV_VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'test-user@example.invalid' }}
          TEST_PASS: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          if [ -z "$TEST_PASS" ]; then
            TEST_PASS="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))')"
          fi
          echo "::add-mask::$TEST_PASS"
          printf 'TEST_USER_PASSWORD=%s\n' "$TEST_PASS" >> "$GITHUB_ENV"
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$API_KEY" >> .env.local
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$AUTH_DOMAIN" >> .env.local
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$PROJECT_ID" >> .env.local
          printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$STORAGE_BUCKET" >> .env.local
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$MESSAGING_SENDER_ID" >> .env.local
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$APP_ID" >> .env.local
          printf 'VITE_FIREBASE_MEASUREMENT_ID=%s\n' "$MEASUREMENT_ID" >> .env.local
          printf 'VITE_STORAGE_CDN_URL=%s\n' "$STORAGE_CDN_URL" >> .env.local
          printf 'VITE_SENTRY_DSN=%s\n' "$SENTRY_DSN" >> .env.local
          printf 'VITE_USE_FIREBASE_EMULATOR=true\n' >> .env.local
          printf 'TEST_USER_EMAIL=%s\n' "$TEST_EMAIL" >> .env.test
          printf 'TEST_USER_PASSWORD=%s\n' "$TEST_PASS" >> .env.test
          printf 'PLAYWRIGHT_BASE_URL=http://localhost:4173\n' >> .env.test
          cat << 'EOF' > functions/.secret.local
          RESEND_API_KEY=mock-resend-key
          EVOLUTION_API_KEY=mock-evolution-key
          RESEND_WEBHOOK_SECRET=mock-webhook-secret
          GEMINI_API_KEY=mock-gemini-key
          SUPERFRETE_SANDBOX_TOKEN=mock-superfrete-token
          ORIGIN_SECRET=mock-origin-secret
          ALEXA_IDENTITY_HMAC_KEY=mock-alexa-hmac-key
          EOF

      - name: Prepare test metrics directory
        if: success() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        run: mkdir -p test-results

      - name: Run Unit Tests (Vitest)
        if: success() && matrix.shard == 1 && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        env:
          TEST_REPORT_DIR: test-results
          TEST_REPORT_NAME: vitest-unit-${{ matrix.shard }}
        run: npm run test:unit

      - name: Lint Functions
        if: success() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        run: npm --prefix functions run lint

      - name: Install Playwright browsers
        if: success() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        run: npx playwright install chromium --with-deps

      - name: Setup Java (for Firebase Emulators)
        if: success() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Firebase CLI from the project lockfile
        if: success() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        run: npx firebase --version

      - name: Run Rules Integration Tests
        if: success() && matrix.shard == 1 && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        env:
          TEST_REPORT_DIR: test-results
          TEST_REPORT_NAME: vitest-integration-${{ matrix.shard }}
        run: npm run test:integration

      - name: Run RTDB Presence Integration Tests
        if: success() && matrix.shard == 1 && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        run: npm run test:presence

      - name: Build
        if: success() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        run: npm run build

      - name: Run E2E tests with Firebase Emulator Suite (0 Cloud Reads)
        if: >-
          success()
          && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
          && (
            (
              (inputs.test_target == 'all' || inputs.test_target == '' || github.event.inputs.test_target == 'all' || github.event.inputs.test_target == '')
              && !contains(github.event.head_commit.message, '[test:security]')
              && !contains(github.event.head_commit.message, '[test:critical]')
              && !contains(github.event.head_commit.message, '[fast]')
              && !contains(github.event.head_commit.message, '[test:fast]')
            )
            || matrix.shard == 1
          )
        env:
          CI: true
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'test-user@example.invalid' }}
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/playwright-shard-${{ matrix.shard }}.json
          INPUT_TARGET: ${{ inputs.test_target || github.event.inputs.test_target || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          npx firebase emulators:exec --project luisices-dev --only auth,firestore,storage,functions "node scripts/seed-emulator.mjs && if [ \"\$INPUT_TARGET\" = 'security' ] || echo \"\$COMMIT_MSG\" | grep -qi '\\[test:security\\]'; then
            echo '🛡️ Executando exclusivamente testes de segurança...'
            npx playwright test tests/e2e/security.spec.ts --project=chromium --reporter=github,list,json,html
          elif [ \"\$INPUT_TARGET\" = 'critical' ] || echo \"\$COMMIT_MSG\" | grep -qiE '\\[test:critical\\]|\\[fast\\]|\\[test:fast\\]'; then
            echo '⚡ Executando testes críticos e de segurança...'
            npx playwright test tests/e2e/critical-flows.spec.ts tests/e2e/permissions.spec.ts tests/e2e/security.spec.ts --project=chromium --reporter=github,list,json,html
          elif [ \"\$INPUT_TARGET\" = 'order-integrity' ]; then
            echo '🧾 Executando E2E de preço, etiquetas, pagamento e conclusão de pedidos...'
            npx playwright test tests/e2e/orders.spec.ts --grep 'formata preço unitário|preserva total e pagamento|importa pedido com 20 etiquetas' --project=chromium --reporter=github,list,json,html
          elif [ -n \"\$INPUT_TARGET\" ] && [ \"\$INPUT_TARGET\" != 'all' ]; then
            echo \"🎯 Executando target específico: \$INPUT_TARGET...\"
            npx playwright test tests/e2e/\${INPUT_TARGET}.spec.ts --project=chromium --reporter=github,list,json,html
          else
            echo '🚀 Executando suíte completa de testes E2E (Máquina ${{ matrix.shard }} de 2)...'
            npx playwright test --shard=${{ matrix.shard }}/2 --project=chromium --reporter=github,list,json,html
          fi"

      - name: Upload raw test metrics
        if: always() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: test-metrics-shard-${{ matrix.shard }}
          path: test-results/*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test report
        if: always() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test videos & traces
        if: always() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Report E2E failures to summary
        if: always() && failure() && (needs.verify-promotion.result != 'success' || needs.verify-promotion.outputs.reuse_e2e != 'true')
        run: |
          echo "## ❌ Falhas E2E no Shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "test-results" ]; then
            echo "### Testes com falha detectados em test-results:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ls -1 test-results >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  test-trends:
    if: always() && needs.verify-promotion.outputs.reuse_e2e != 'true'
    needs: [e2e-tests, verify-promotion]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download test metrics from all shards
        uses: actions/download-artifact@v4
        with:
          pattern: test-metrics-shard-*
          path: test-results
          merge-multiple: true

      - name: Restore recent test history
        uses: actions/cache/restore@v4
        with:
          path: test-trends/history.json
          key: test-trends-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-trends-${{ github.base_ref || github.ref_name }}-
            test-trends-main-

      - name: Generate charts and comparison summary
        id: generate-trends
        env:
          TEST_RESULTS_DIR: test-results
          TEST_TREND_DIR: test-trends
          TEST_TREND_BRANCH: ${{ github.head_ref || github.ref_name }}
          TEST_TREND_TARGET: ${{ inputs.test_target || github.event.inputs.test_target || (contains(github.event.head_commit.message, '[test:security]') && 'security') || (contains(github.event.head_commit.message, '[test:critical]') && 'critical') || (contains(github.event.head_commit.message, '[fast]') && 'critical') || (contains(github.event.head_commit.message, '[test:fast]') && 'critical') || 'all' }}
        run: node scripts/summarize-test-trends.mjs

      - name: Upload test trend charts and history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-trends
          path: test-trends/
          retention-days: 90

      - name: Save history for trusted branch runs
        if: always() && steps.generate-trends.outputs.has_metrics == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: test-trends/history.json
          key: test-trends-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
