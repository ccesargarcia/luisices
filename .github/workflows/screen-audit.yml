name: Auditoria Completa de Telas & Layout (Manual)

on:
  workflow_dispatch:
    inputs:
      viewport_mode:
        description: 'Modo de auditoria'
        required: true
        type: choice
        options:
          - 'Completo (Desktop + Mobile + Modais)'
          - 'Apenas Mobile e Modais'
        default: 'Completo (Desktop + Mobile + Modais)'

permissions:
  contents: read

concurrency:
  group: "screen-audit-manual"
  cancel-in-progress: false

jobs:
  screen-audit:
    name: Varredura de Telas e Caça a Bugs Visuais
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Unit Tests (Vitest)
        run: |
          if grep -q '"test:unit"' package.json; then
            npm run test:unit
          else
            echo "Aviso: Script test:unit não encontrado nesta branch. Pulando..."
          fi

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env files with DEV secrets
        env:
          API_KEY: ${{ secrets.DEV_VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET }}
          MESSAGING_SENDER_ID: ${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.DEV_VITE_FIREBASE_APP_ID }}
          MEASUREMENT_ID: ${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID }}
          STORAGE_CDN_URL: ${{ secrets.DEV_VITE_STORAGE_CDN_URL || 'https://cdn-dev.luisices.com.br' }}
          SENTRY_DSN: ${{ secrets.DEV_VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_PASS: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$API_KEY" >> .env.local
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$AUTH_DOMAIN" >> .env.local
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$PROJECT_ID" >> .env.local
          printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$STORAGE_BUCKET" >> .env.local
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$MESSAGING_SENDER_ID" >> .env.local
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$APP_ID" >> .env.local
          printf 'VITE_FIREBASE_MEASUREMENT_ID=%s\n' "$MEASUREMENT_ID" >> .env.local
          printf 'VITE_STORAGE_CDN_URL=%s\n' "$STORAGE_CDN_URL" >> .env.local
          printf 'VITE_SENTRY_DSN=%s\n' "$SENTRY_DSN" >> .env.local
          printf 'TEST_USER_EMAIL=%s\n' "$TEST_EMAIL" >> .env.test
          printf 'TEST_USER_PASSWORD=%s\n' "$TEST_PASS" >> .env.test
          printf 'PLAYWRIGHT_BASE_URL=http://localhost:4173\n' >> .env.test

      - name: Build
        run: npm run build

      - name: Run Screen Audit Tests
        env:
          CI: true
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        run: |
          if [ "${{ github.event.inputs.viewport_mode }}" = "Apenas Mobile e Modais" ]; then
            echo "📱 Executando auditoria focada em Mobile e Modais..."
            npx playwright test tests/e2e/screen-audit.spec.ts -g "\[Mobile\]|Modal" --project=chromium --reporter=list,html
          else
            echo "🖥️📱 Executando auditoria completa de telas (Desktop + Mobile + Modais)..."
            npx playwright test tests/e2e/screen-audit.spec.ts --project=chromium --reporter=list,html
          fi

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-audit-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Videos & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-audit-results
          path: test-results/
          retention-days: 14
