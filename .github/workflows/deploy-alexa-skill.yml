name: Deploy Alexa Skill (ASK SMAPI)

on:
  push:
    branches:
      - develop
    paths:
      - 'alexa/**'
  workflow_dispatch:

concurrency:
  group: "alexa-skill-deploy"
  cancel-in-progress: false

jobs:
  deploy-alexa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install ASK CLI
        run: npm install -g ask-cli

      - name: Deploy Interaction Model & Manifest
        env:
          ASK_CLI_CONFIG: ${{ secrets.ASK_CLI_CONFIG }}
          ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
          SKILL_ID: ${{ secrets.ALEXA_SKILL_ID || 'amzn1.ask.skill.1cd0031f-ada0-4da8-8721-2ad44b4b1c96' }}
        run: |
          mkdir -p ~/.ask
          if [ -n "$ASK_CLI_CONFIG" ]; then
            echo "$ASK_CLI_CONFIG" > ~/.ask/cli_config
            chmod 600 ~/.ask/cli_config
            echo "✅ Credenciais configuradas com sucesso via ASK_CLI_CONFIG."
          elif [ -n "$ASK_REFRESH_TOKEN" ]; then
            cat <<EOF > ~/.ask/cli_config
          {
            "profiles": {
              "default": {
                "token": {
                  "refresh_token": "${ASK_REFRESH_TOKEN}",
                  "token_type": "bearer"
                }
              }
            }
          }
          EOF
            chmod 600 ~/.ask/cli_config
            echo "✅ Credenciais configuradas com sucesso via ASK_REFRESH_TOKEN."
          else
            echo "::warning ::Nenhum segredo (ASK_CLI_CONFIG ou ASK_REFRESH_TOKEN) configurado no repositório. Pule a etapa ou configure o segredo no GitHub para deploy automático."
            exit 0
          fi
          
          echo "🚀 Atualizando modelo de interação pt-BR..."
          ask smapi set-interaction-model -s "$SKILL_ID" -g development -l pt-BR --interaction-model "file:alexa/skill-package/interactionModels/custom/pt-BR.json"
          
          echo "🚀 Atualizando manifesto skill.json..."
          ask smapi update-skill-manifest -s "$SKILL_ID" -g development --manifest "file:alexa/skill-package/skill.json"
          
          echo "✅ Modelo e manifesto enviados com sucesso para a Amazon Alexa!"

