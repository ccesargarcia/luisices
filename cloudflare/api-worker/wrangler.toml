name = "functions-prod"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
BACKEND_ORIGIN = "https://us-central1-papelaria-dashboard.cloudfunctions.net"

[observability]
enabled = true
head_sampling_rate = 1

  [observability.logs]
  invocation_logs = false

[env.production]
name = "functions-prod"
routes = [
  { pattern = "api.luisices.com.br/*", zone_name = "luisices.com.br" }
]
[env.production.vars]
ENVIRONMENT = "production"
BACKEND_ORIGIN = "https://us-central1-papelaria-dashboard.cloudfunctions.net"

  [env.production.observability]
  enabled = true
  head_sampling_rate = 1

    [env.production.observability.logs]
    invocation_logs = false

[[env.production.ratelimits]]
name = "PUBLIC_ORDER_TRACKING_LIMITER"
namespace_id = "6634920187"

  [env.production.ratelimits.simple]
  limit = 30
  period = 60

[env.dev]
name = "functions-dev"
routes = [
  { pattern = "api.dev.luisices.com.br/*", zone_name = "luisices.com.br" }
]
[env.dev.vars]
ENVIRONMENT = "dev"
BACKEND_ORIGIN = "https://us-central1-luisices-dev.cloudfunctions.net"

  [env.dev.observability]
  enabled = true
  head_sampling_rate = 1

    [env.dev.observability.logs]
    invocation_logs = false

[[env.dev.ratelimits]]
name = "PUBLIC_ORDER_TRACKING_LIMITER"
namespace_id = "6634920188"

  [env.dev.ratelimits.simple]
  limit = 30
  period = 60
